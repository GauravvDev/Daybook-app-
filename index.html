/* =========================================================
   VIEW: CYCLE  (menstrual cycle tracking)
   Opt-in. Everything below stays in localStorage on this
   device, exactly like the rest of My Day Buddy — nothing is sent
   anywhere. Predictions are estimates from your own logs,
   not medical advice or contraception.
   ========================================================= */
const DEFAULT_CYCLE_LEN = 28, DEFAULT_PERIOD_LEN = 5;

function cyc(){
  if(!state.cycle || typeof state.cycle!=="object") state.cycle = {periods:[], logs:{}};
  if(!Array.isArray(state.cycle.periods)) state.cycle.periods = [];
  if(!state.cycle.logs || typeof state.cycle.logs!=="object") state.cycle.logs = {};
  return state.cycle;
}
function cycleEnabled(){ return !!(state.settings && state.settings.cycleTrackingEnabled); }
function navItems(){ return NAV_ITEMS.filter(n=> n.id!=="cycle" || cycleEnabled()); }
function moreSheetItems(){ return MORE_SHEET_ITEMS.filter(id=> id!=="cycle" || cycleEnabled()); }

function daysBetween(a,b){
  const [y1,m1,d1]=a.split("-").map(Number), [y2,m2,d2]=b.split("-").map(Number);
  return Math.round((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/86400000);
}
function sortedPeriods(){ return cyc().periods.slice().sort((a,b)=> a.start<b.start?-1:(a.start>b.start?1:0)); }
function activePeriod(){ return sortedPeriods().filter(p=>!p.end).pop() || null; }
function lastPeriod(){ const ps=sortedPeriods(); return ps.length? ps[ps.length-1] : null; }
function cycleLengths(){
  const ps = sortedPeriods(); const out=[];
  for(let i=1;i<ps.length;i++){ const d = daysBetween(ps[i-1].start, ps[i].start); if(d>=15 && d<=60) out.push(d); }
  return out;
}
function periodLengths(){
  return sortedPeriods().filter(p=>p.end).map(p=> daysBetween(p.start,p.end)+1).filter(n=>n>=1 && n<=15);
}
function avgOf(arr, fallback){
  if(!arr.length) return fallback;
  return Math.round(arr.reduce((a,b)=>a+b,0)/arr.length);
}
function avgCycleLength(){
  const o = parseInt(state.settings.avgCycleLengthOverride,10);
  if(o && o>=15 && o<=60) return o;
  return avgOf(cycleLengths().slice(-6), DEFAULT_CYCLE_LEN);
}
function avgPeriodLength(){
  const o = parseInt(state.settings.avgPeriodLengthOverride,10);
  if(o && o>=1 && o<=15) return o;
  return avgOf(periodLengths().slice(-6), DEFAULT_PERIOD_LEN);
}
function cyclePrediction(){
  const last = lastPeriod();
  if(!last) return null;
  const cl = avgCycleLength(), pl = avgPeriodLength();
  const today = todayKey();
  let nextStart = addDays(last.start, cl);
  let guard = 0;
  while(nextStart < today && guard++ < 36) nextStart = addDays(nextStart, cl);
  const ovulation = addDays(nextStart, -14);
  return {
    lastStart:last.start, cycleLength:cl, periodLength:pl,
    nextStart, nextEnd:addDays(nextStart, pl-1), ovulation,
    fertileStart:addDays(ovulation,-5), fertileEnd:addDays(ovulation,1),
    daysUntil: daysBetween(today, nextStart),
    estimated: cycleLengths().length===0,
  };
}
function cycleDayFor(dateKey){
  const ps = sortedPeriods().filter(p=> p.start<=dateKey);
  if(!ps.length) return null;
  const n = daysBetween(ps[ps.length-1].start, dateKey)+1;
  return (n>0 && n<=90) ? n : null;
}
function isPeriodDay(dateKey){
  return sortedPeriods().some(p=>{
    if(dateKey < p.start) return false;
    return dateKey <= (p.end || todayKey());
  });
}
function cyclePhase(dateKey){
  if(isPeriodDay(dateKey)) return {id:"menstrual", label:"Menstrual phase", color:"var(--cyc-period)"};
  const p = cyclePrediction();
  const cd = cycleDayFor(dateKey);
  if(!p || cd==null) return null;
  if(dateKey>=p.fertileStart && dateKey<=p.fertileEnd) return {id:"fertile", label:"Fertile window", color:"var(--cyc-fertile)"};
  return cd < (p.cycleLength-14)
    ? {id:"follicular", label:"Follicular phase", color:"var(--accent)"}
    : {id:"luteal", label:"Luteal phase", color:"var(--gold)"};
}
/* map of dateKey -> {period, predPeriod, fertile, ovulation, logged} */
function cycleMarks(){
  const marks = {};
  const set = (k,f)=>{ marks[k] = Object.assign({}, marks[k], f); };
  const ps = sortedPeriods();
  const today = todayKey();
  ps.forEach(p=>{
    const end = p.end || today;
    let d = p.start, guard = 0;
    while(d<=end && guard++<70){ set(d,{period:true}); d = addDays(d,1); }
  });
  for(let i=1;i<ps.length;i++){
    const gap = daysBetween(ps[i-1].start, ps[i].start);
    if(gap<15 || gap>60) continue;
    const ov = addDays(ps[i].start, -14);
    for(let k=-5;k<=1;k++) set(addDays(ov,k), {fertile:true});
    set(ov, {ovulation:true});
  }
  const pred = cyclePrediction();
  if(pred){
    for(let k=0;k<pred.periodLength;k++) set(addDays(pred.nextStart,k), {predPeriod:true});
    for(let k=-5;k<=1;k++) set(addDays(pred.ovulation,k), {fertile:true});
    set(pred.ovulation, {ovulation:true});
  }
  const logs = cyc().logs;
  Object.keys(logs).forEach(k=>{
    const l = logs[k]||{};
    if(l.flow || (l.symptoms&&l.symptoms.length) || (l.note&&l.note.trim())) set(k,{logged:true});
  });
  return marks;
}
function flowMeta(id){ return FLOW_LEVELS.find(f=>f.id===id) || null; }
function cycleLogFor(key){ const l = cyc().logs[key]; return l ? Object.assign({flow:null,symptoms:[],note:""}, l) : {flow:null,symptoms:[],note:""}; }
function setCycleLog(key, patch){
  const cur = cycleLogFor(key);
  const next = Object.assign(cur, patch);
  if(!next.flow && (!next.symptoms || !next.symptoms.length) && !(next.note||"").trim()) delete cyc().logs[key];
  else cyc().logs[key] = next;
  save();
}
function startPeriod(dateKey){
  const c = cyc();
  const act = activePeriod();
  if(act && act.start<=dateKey){ toast("A period is already running — end it first"); return false; }
  if(c.periods.some(p=>p.start===dateKey)){ toast("Already marked as a period start"); return false; }
  c.periods.push({id:uid(), start:dateKey, end:null});
  save();
  return true;
}
function endPeriodOn(dateKey){
  const act = activePeriod();
  if(!act){ toast("No period is currently running"); return false; }
  if(dateKey < act.start){ toast("End date can't be before the start"); return false; }
  act.end = dateKey;
  save();
  return true;
}

    setCycleLog(sel, {flow: cur.flow===b.dataset.flow ? null : b.dataset.flow});
    renderCycle();
  });
  root.querySelectorAll("[data-symptom]").forEach(b=> b.onclick = ()=>{
    const cur = cycleLogFor(sel);
    const list = (cur.symptoms||[]).slice();
    const name = b.dataset.symptom;
    const i = list.indexOf(name);
    if(i>=0) list.splice(i,1); else list.push(name);
    setCycleLog(sel, {symptoms:list});
    renderCycle();
  });
  root.querySelectorAll("[data-cyc-mood]").forEach(b=> b.onclick = ()=>{
    const v = parseInt(b.dataset.cycMood,10);
    state.mood.logs[sel] = Object.assign({}, state.mood.logs[sel], {value:v});
    save(); renderCycle();
  });
  document.getElementById("cyc-save-note").onclick = ()=>{
    setCycleLog(sel, {note: document.getElementById("cyc-note").value});
    toast("Saved","check"); renderCycle();

  document.getElementById("cyc-mark-end").onclick = ()=>{ if(endPeriodOn(sel)){ toast("Period end logged","check"); renderCycle(); } };
  mountIcons();
}

function renderCalendar(){
  const root = document.getElementById("view-root");

  for(let i=firstDow-1;i>=0;i--) cells.push({d:daysInPrevMonth-i, other:true, key:null});
  for(let d=1; d<=daysInMonth; d++){
    const key = year+"-"+String(month+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");

          ${cells.map(c=>{
            if(c.other) return `<div class="cal-cell other-month">${c.d}</div>`;
            const hasActivity = dayHasActivity(c.key);
            const cmk = cycMarks[c.key] || {};
            const cycStyle = cmk.period? ' style="background:var(--cyc-period-soft); color:var(--cyc-period);"'
                            : cmk.predPeriod? ' style="border-style:dashed; border-color:var(--cyc-period); color:var(--cyc-period);"'

            return `<div class="cal-cell ${c.key===todayKey()?'today':''} ${c.key===sel?'selected':''}"${c.key===sel?'':cycStyle} data-daykey="${c.key}">
              <span>${c.d}</span>${hasActivity?'<span class="cal-dot"></span>':''}

          <span><i class="cyc-swatch" style="background:var(--cyc-period);"></i> Period</span>
          <span><i class="cyc-swatch" style="border:1px dashed var(--cyc-period);"></i> Predicted</span>
          <span><i class="cyc-swatch" style="background:var(--cyc-fertile);"></i> Fertile</span>
        </div>`:""}
        <button class="btn btn-ghost" id="cal-today" style="width:100%; margin-top:14px;">${icon("calendar",15)} Jump to Today</button>
      </div>
      <div id="cal-detail"></div>
    </div>
  `;
  document.getElementById("cal-prev").onclick = ()=>{ ui.calMonth = new Date(year, month-1, 1); renderCalendar(); };
  document.getElementById("cal-next").onclick = ()=>{ ui.calMonth = new Date(year, month+1, 1); renderCalendar(); };
  document.getElementById("cal-today").onclick = ()=>{ ui.calMonth = new Date(); ui.calSelected = todayKey(); renderCalendar(); };

  renderCalDetail();

function dayHasActivity(key){
  if(!key) return false;
  if(state.tasks.some(t=>t.date===key && t.completed)) return true;
  if(state.habitLogs[key] && Object.values(state.habitLogs[key]).some(Boolean)) return true;
  if(state.water.logs[key]>0) return true;
  if(state.mood.logs[key]) return true;
  if(state.workouts.some(w=>w.date===key)) return true;
  return false;
}

function weekStats(days){
  const completion = Math.round(days.reduce((s,d)=>s+dayCompletionPct(d),0)/days.length);
  const waterAvg = Math.round(days.reduce((s,d)=>s+(state.water.logs[d]||0),0)/days.length);
  const focusTotal = days.reduce((s,d)=>s+(state.pomodoro.sessions[d]||0),0);
  const workoutDays = days.filter(d=>state.workouts.some(w=>w.date===d)).length;
  const moodVals = days.map(d=>(state.mood.logs[d]||{}).value).filter(Boolean);
  const moodAvg = moodVals.length ? Math.round(moodVals.reduce((a,b)=>a+b,0)/moodVals.length*10)/10 : null;
  const habitRate = state.habits.length ? Math.round(days.reduce((s,d)=>{
    const done = state.habits.filter(h=>(state.habitLogs[d]||{})[h.id]).length;
    return s + (done/state.habits.length*100);
  },0)/days.length) : 0;
  return {completion, waterAvg, focusTotal, workoutDays, moodAvg, habitRate};
}
function trendArrow(curr, prev){
  if(prev===null || curr===null) return "";
  const diff = curr-prev;
  if(Math.abs(diff)<1) return `<span class="muted" style="font-size:11px;">— steady</span>`;
  const up = diff>0;
  return `<span style="font-size:11px; font-weight:700; color:${up?'var(--accent)':'var(--danger)'};">${up?'↑':'↓'} ${Math.abs(Math.round(diff))}</span>`;
}

        <div style="display:flex; align-items:baseline; gap:6px;"><span class="mono" style="font-weight:700; font-size:17px;">${cur.completion}%</span>${trendArrow(cur.completion,prev.completion)}</div>

        <div class="muted" style="font-size:11px;">Habit consistency</div>

function barChart(labels, values, unit){
  const max = Math.max(1, ...values);
  return `<div class="chart-bars">
    ${values.map((v,i)=>`
      <div style="flex:1; text-align:center;">
        <div class="cb" style="height:90px;"><span style="height:${clamp(v/max*100,3,100)}%; position:absolute; bottom:0; left:0; right:0;"></span></div>
        <div class="cb-label-standalone">${labels[i].slice(8)}</div>
      </div>
    `).join("")}
  </div>
  <div class="muted" style="font-size:11px; text-align:right; margin-top:4px;">unit: ${unit}</div>`;
}
function moodLineChart(labels, values){
  const w=280, h=90, pad=14;
  const pts = values.map((v,i)=>{
    const x = pad + (i/(values.length-1))*(w-2*pad);
    const y = v? (h-pad) - ((v-1)/4)*(h-2*pad) : null;
    return {x,y,v};
  });
  const validPts = pts.filter(p=>p.y!==null);
  const path = validPts.map((p,i)=> (i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${validPts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="var(--accent)"/>`).join("")}
  </svg>
  <div style="display:flex; justify-content:space-between; margin-top:2px;">${labels.map(l=>`<span style="font-size:10px; color:var(--ink-soft);">${l.slice(8)}</span>`).join("")}</div>`;
}

/* =========================================================
   STORAGE, PERMISSIONS & LEGAL
   ========================================================= */
const APP_VERSION = "1.3.0";
const LEGAL_VERSION = "2026-09-01";
const LEGAL_UPDATED = "1 September 2026";
const CONTACT_EMAIL = "contact.gauravhq@gmail.com";
const REPO_URL = "https://github.com/GauravvDev/Daybook-app-";

/* ---------- storage ---------- */
let storagePersisted = false;
async function checkStoragePersisted(){
  try{
    if(navigator.storage && navigator.storage.persisted){
      storagePersisted = await navigator.storage.persisted();
    }
  }catch(e){}
  return storagePersisted;
}
async function requestPersistentStorage(){
  try{
    if(!navigator.storage || !navigator.storage.persist) return false;
    const ok = await navigator.storage.persist();
    storagePersisted = ok;
    return ok;
  }catch(e){ return false; }
}
async function storageEstimate(){
  try{
    if(navigator.storage && navigator.storage.estimate){
      const e = await navigator.storage.estimate();
      return {usage:e.usage||0, quota:e.quota||0};
    }
  }catch(e){}
  return null;
}
function fmtBytes(n){
  if(!n) return "0 KB";
  if(n < 1024*1024) return (n/1024).toFixed(0)+" KB";
  return (n/1024/1024).toFixed(1)+" MB";
}
function daysSinceExport(){
  if(!state.settings.lastExportAt) return null;
  return Math.floor((Date.now()-state.settings.lastExportAt)/86400000);
}
/* Deliberately excludes the sample content a fresh install ships with —
   nobody should be told to back up a journal they haven't written yet. */
function hasMeaningfulData(){
  return Object.keys(state.journal.entries||{}).length>1
      || Object.keys(state.habitLogs||{}).length>2
      || (state.cycle && state.cycle.periods.length>0)
      || state.tasks.length>6;
}
function shouldNudgeBackup(){
  if(!hasMeaningfulData()) return false;
  const first = state.settings.firstRunAt;
  if(!first || (Date.now()-first) < 7*86400000) return false;  // give people a week before nagging
  const dismissed = state.settings.backupNudgeDismissedAt;
  if(dismissed && (Date.now()-dismissed) < 14*86400000) return false;
  const d = daysSinceExport();
  return d===null || d>=30;
}

/* ---------- platform ---------- */
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPadOS pretends to be a Mac
}
function isStandalone(){
  return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
      || navigator.standalone === true;
}
/* On iPhone, Safari wipes a site's storage after 7 days of not being opened.
   Apps added to the Home Screen are exempt - so this is a data-safety prompt,
   not a growth-hack banner. */
function shouldNudgeInstall(){
  if(!isIOS() || isStandalone()) return false;
  const d = state.settings.installNudgeDismissedAt;
  return !(d && (Date.now() - d) < 30*86400000);
}

function exportData(){

  a.href = url; a.download = "daybuddy-export-"+todayKey()+".json";
  document.body.appendChild(a); a.click(); a.remove();

function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      state = Object.assign(defaultState(), parsed);
      save(); applyTheme(); render(); renderShell();
      toast("Data imported","upload");
    }catch(err){ toast("Import failed — invalid file"); }
  };
  reader.readAsText(file);
  e.target.value="";
}

   ========================================================= */
let audioCtx=null;
function playSound(){
  if(!state.settings.notifSound) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const freqMap = {chime:[880,1108], ping:[1200], bell:[660,990,1320]};
    const freqs = freqMap[state.settings.soundChoice] || freqMap.chime;
    freqs.forEach((f,i)=>{
      const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
      o.type="sine"; o.frequency.value=f;
      o.connect(g); g.connect(audioCtx.destination);
      const t0 = audioCtx.currentTime + i*0.12;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.18, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+0.35);
      o.start(t0); o.stop(t0+0.4);
    });
  }catch(e){}
}
function requestNotifPermissionThenTest(){
  if(!("Notification" in window)){ toast("Notifications aren't supported here — using in-app alerts instead."); playSound(); return; }
  if(Notification.permission==="granted"){ notify("Test notification","This is what your reminders will look like."); return; }
  if(Notification.permission==="denied"){ toast("Notifications are blocked in browser settings."); return; }
  Notification.requestPermission().then(p=>{
    if(p==="granted") notify("Notifications enabled","You'll get reminders here.");
    else toast("Permission not granted — using in-app alerts instead.");
  });
}
function notify(title, body){
  playSound();
  if(Native.on){
    try{
      Native.LN.schedule({ notifications:[{ id: nid("now-"+title+"-"+Date.now()), title, body,
        schedule:{ at: new Date(Date.now()+1200) }, smallIcon:"ic_stat_daybook", channelId:"daybook-reminders" }] });
      return;
    }catch(e){}
  }
  if("Notification" in window && Notification.permission==="granted"){
    try{ new Notification(title, {body, icon:"icon-192.png"}); return; }catch(e){}
  }
  toast(title+(body?" — "+body:""), "bell");
}
function ensureNotifPermission(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{
      if(p==="granted") toast("Reminders enabled","bell");
    });
  }
}

/* ================= NATIVE LOCAL NOTIFICATIONS (Capacitor) =================
   On the web this whole block is inert and the polling engine below runs as
   before. Inside the Capacitor Android build, reminders are handed to
   Android's alarm scheduler instead, so they fire when the app is CLOSED.
   ------------------------------------------------------------------------ */
const Native = {
  get on(){
    try{
      return !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === "function"
                && window.Capacitor.isNativePlatform()
                && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications);
    }catch(e){ return false; }
  },
  get LN(){ return window.Capacitor.Plugins.LocalNotifications; }
};

/* Stable positive 31-bit id from a string, so re-scheduling replaces cleanly. */
function nid(str){
  let h = 5381;
  for(let i=0;i<str.length;i++){ h = ((h<<5) + h + str.charCodeAt(i)) | 0; }
  return Math.abs(h) % 2000000000 + 1;
}
function atLocal(dateKey, hhmm){
  const [y,m,d] = dateKey.split("-").map(Number);
  const [hh,mi] = hhmm.split(":").map(Number);
  return new Date(y, m-1, d, hh, mi, 0, 0);
}

/* Everything My Day Buddy should wake the phone for, for the next `days` days. */
function collectNativeReminders(days){
  const out = [];
  const s = state.settings;
  const now = Date.now();
  const push = (key, title, body, when, extra) => {
    if(!(when instanceof Date) || isNaN(when) || when.getTime() <= now + 5000) return;
    const o = { id: nid(key), title, body, schedule: Object.assign({ at: when, allowWhileIdle: true }, extra||{}),
                smallIcon: "ic_stat_daybook", channelId: "daybook-reminders" };
    out.push(o);
  };

  for(let dOff=0; dOff<days; dOff++){
    const dk = addDays(todayKey(), dOff);

    if(s.notifTasks){
      state.tasks.filter(t=>t.reminder && !t.completed && t.date===dk && t.time).forEach(t=>{
        push("task-"+t.id+"-"+dk, "Task reminder", t.title, atLocal(dk, t.time));
      });
    }
    if(s.notifFocusSessions !== false){
      state.focusSessions.filter(f=>!f.completed && f.date===dk && f.startTime).forEach(f=>{
        push("session-"+f.id+"-"+dk, "Session reminder",
             (f.label||sessionTypeMeta(f.type).label)+" is scheduled now", atLocal(dk, f.startTime));
      });
    }
    if(s.notifMeds){
      const taken = state.medicineLogs[dk] || {};
      state.medicines.filter(m=>m.time && !taken[m.id]).forEach(m=>{
        push("med-"+m.id+"-"+dk, "Medicine reminder",
             m.name + (m.dosage ? " — "+m.dosage : ""), atLocal(dk, m.time));
      });
    }
  }

  if(cycleEnabled() && s.notifCycle){
    const pred = cyclePrediction();
    if(pred){
      const lead = (s.cycleReminderDays==null) ? 2 : s.cycleReminderDays;
      if(lead > 0){
        const warn = addDays(pred.nextStart, -lead);
        push("cyc-warn-"+warn, "Period coming up",
             "Predicted to start in "+lead+" day"+(lead===1?"":"s")+", around "+fmtDateLong(pred.nextStart)+".",
             atLocal(warn, "09:00"));
      }
      push("cyc-due-"+pred.nextStart, "Period predicted today",
           "Log it in My Day Buddy so the next prediction stays accurate.", atLocal(pred.nextStart, "09:00"));
      if(pred.fertileStart){
        push("cyc-fert-"+pred.fertileStart, "Fertile window starting",
             "Estimated from your logged cycles — not a contraceptive method.", atLocal(pred.fertileStart, "09:00"));
      }
    }
  }
  return out.slice(0, 60); /* keep well under Android's pending-alarm ceiling */
}

async function openExactAlarmSettings(){
  if(!Native.on) return false;
  try{
    if(typeof Native.LN.changeExactNotificationSetting === "function"){
      await Native.LN.changeExactNotificationSetting();
      return true;
    }
  }catch(e){}
  return false;
}
let nativeSyncTimer = null;
async function syncNativeNotifications(){
  if(!Native.on) return;
  clearTimeout(nativeSyncTimer);
  nativeSyncTimer = setTimeout(async ()=>{
    try{
      let perm = await Native.LN.checkPermissions();
      if(perm.display !== "granted"){
        perm = await Native.LN.requestPermissions();
        if(perm.display !== "granted") return;
      }
      try{
        await Native.LN.createChannel({ id:"daybook-reminders", name:"Reminders",
          description:"Task, medicine, focus and cycle reminders", importance:4, visibility:1 });
      }catch(e){}
      const pending = await Native.LN.getPending();
      if(pending && pending.notifications && pending.notifications.length){
        await Native.LN.cancel({ notifications: pending.notifications.map(n=>({id:n.id})) });
      }
      const items = collectNativeReminders(14);
      if(!items.length) return;
      /* Android 14+ refuses exact alarms unless the user has granted them.
         Try exact first, fall back to inexact rather than losing reminders. */
      try{
        await Native.LN.schedule({ notifications: items });
      }catch(err){
        const relaxed = items.map(n=>{
          const c = JSON.parse(JSON.stringify(n));
          c.schedule = { at: n.schedule.at, allowWhileIdle: false };
          return c;
        });
        await Native.LN.schedule({ notifications: relaxed });
        state.settings.exactAlarmsBlocked = true; 
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e2){}
      }
    }catch(e){ console.warn("native notification sync failed", e); }
  }, 400);
}

/* ---------------- reminder engine (fixed) ----------------
   Runs every 15s (not gated to an exact second) and dedupes with
   a fired-set so a throttled/background tab still catches reminders
   without spamming repeats. */
const firedReminders = new Set();
function startReminderEngine(){
  if(Native.on){
    /* Android schedules these itself; polling would double-fire. */
    syncNativeNotifications();
    document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) syncNativeNotifications(); });
    return;
  }
  checkReminders();
  setInterval(checkReminders, 15000);
}
function checkReminders(){
  const now = new Date();
  const hhmm = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  const today = todayKey();
  if(state.settings.notifTasks){
    state.tasks.filter(t=>t.reminder && !t.completed && t.date===today && t.time).forEach(t=>{
      const key = "task-"+t.id+"-"+today;
      if(!firedReminders.has(key) && hhmm>=t.time){
        firedReminders.add(key);
        notify("Task reminder", t.title);
      }
    });
  }
  if(state.settings.notifMeds){
    const medLog = state.medicineLogs[today]||{};
    state.medicines.filter(m=>m.time && !medLog[m.id]).forEach(m=>{
      const key = "med-"+m.id+"-"+today;
      if(!firedReminders.has(key) && hhmm>=m.time){
        firedReminders.add(key);
        notify("Medicine reminder", m.name+(m.dosage?" — "+m.dosage:""));
      }
    });
  }
  if(cycleEnabled() && state.settings.notifCycle && hhmm>="09:00"){
    const pred = cyclePrediction();
    if(pred){
      const lead = (state.settings.cycleReminderDays==null) ? 2 : state.settings.cycleReminderDays;
      const warnDay = addDays(pred.nextStart, -lead);
      if(lead>0 && today===warnDay && !firedReminders.has("cyc-warn-"+today)){
        firedReminders.add("cyc-warn-"+today);
        notify("Period coming up", "Predicted to start in "+lead+" day"+(lead===1?"":"s")+", around "+fmtDateLong(pred.nextStart)+".");
      }
      if(today===pred.nextStart && !firedReminders.has("cyc-due-"+today)){
        firedReminders.add("cyc-due-"+today);
        notify("Period predicted today", "Log it in My Day Buddy so the next prediction stays accurate.");
      }
      if(today===pred.fertileStart && !firedReminders.has("cyc-fert-"+today)){
        firedReminders.add("cyc-fert-"+today);
        notify("Fertile window starting", "Estimated from your logged cycles — not a contraceptive method.");
      }
    }
  }
  if(state.settings.notifFocusSessions !== false){
    state.focusSessions.filter(s=>!s.completed && s.date===today && s.startTime).forEach(s=>{
      const key = "session-"+s.id+"-"+today;
      if(!firedReminders.has(key) && hhmm>=s.startTime){
        firedReminders.add(key);
        notify("Session reminder", (s.label||sessionTypeMeta(s.type).label)+" is scheduled now");
      }
    });
  }
}
document.addEventListener("DOMContentLoaded", init);
})();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>My Day Buddy — Track your day. Understand yourself.</title>
<meta name="description" content="A calm personal command center for tasks, habits, health and reflection." />
<meta name="theme-color" content="#4F7A68" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<!-- iOS ignores manifest icons and cannot read SVG here: without a PNG it puts a
     screenshot of the page on the Home Screen. -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="My Day Buddy" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
:root{
  --bg:#F5F3EE; --bg-soft:#ECE7DC; --card:#FFFFFF; --card-2:#FBFAF7;
  --ink:#23262B; --ink-soft:#6B6F76; --ink-faint:#9A9EA3;
  --border:#E5E0D3; --accent:#4F7A68; --accent-ink:#ffffff;
  --accent-soft:#E3EEE7; --clay:#D98E73; --clay-soft:#F7E7DE;
  --danger:#C1543C; --danger-soft:#F8E3DD; --gold:#C99A3E;
  --cyc-period:#C2536B; --cyc-period-soft:#F8E1E7; --cyc-fertile:#4F8FA6; --cyc-fertile-soft:#E2EEF3;
  --radius-lg:22px; --radius-md:16px; --radius-sm:10px;
  --shadow: 0 1px 2px rgba(35,38,43,.04), 0 8px 24px -12px rgba(35,38,43,.12);
  --shadow-lift: 0 2px 6px rgba(35,38,43,.06), 0 16px 40px -16px rgba(35,38,43,.22);
  color-scheme: light;
}
[data-theme="dark"]{
  --bg:#15171A; --bg-soft:#1B1E22; --card:#1E2126; --card-2:#20242A;
  --ink:#ECEDEE; --ink-soft:#9BA1A8; --ink-faint:#6B7078;
  --border:#2B2F35; --accent:#6EA88F; --accent-ink:#0F1512;
  --accent-soft:rgba(110,168,143,.16); --clay:#E2A183; --clay-soft:rgba(226,161,131,.14);
  --danger:#E17A63; --danger-soft:rgba(225,122,99,.14); --gold:#D9B15C;
  --cyc-period:#E8879E; --cyc-period-soft:rgba(232,135,158,.18); --cyc-fertile:#79B8CE; --cyc-fertile-soft:rgba(121,184,206,.18);
  --shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px -12px rgba(0,0,0,.5);
  --shadow-lift: 0 2px 6px rgba(0,0,0,.3), 0 20px 48px -18px rgba(0,0,0,.6);
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  transition:background .25s ease,color .25s ease;
}
h1,h2,h3,.display{font-family:'Fraunces',serif; font-weight:600; letter-spacing:-.01em;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

/* ---------- shell ---------- */
#shell{display:flex; min-height:100vh;}
#sidebar{
  width:236px; flex-shrink:0; background:var(--bg-soft); border-right:1px solid var(--border);
  padding:24px 16px; display:flex; flex-direction:column; gap:3px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px; padding:6px 10px 22px;}
.brand-mark{width:34px;height:34px;border-radius:10px;background:#141513; display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.brand-mark svg{display:block;}
.brand-name{font-family:'Fraunces',serif; font-weight:600; font-size:19px;}
.nav-item{
  display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px; cursor:pointer;
  color:var(--ink-soft); font-size:14.5px; font-weight:500; border:none; background:transparent; width:100%; text-align:left;
  transition:background .15s ease, color .15s ease;
}
.nav-item:hover{background:var(--card);}
.nav-item.active{background:var(--accent-soft); color:var(--accent); font-weight:600;}
.nav-item svg{width:19px;height:19px; flex-shrink:0;}
.sidebar-foot{margin-top:auto; padding:10px; display:flex; align-items:center; gap:10px; border-top:1px solid var(--border); padding-top:16px;}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Fraunces',serif;flex-shrink:0;}

#main{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{display:none;}
#view-root{padding:28px 34px 100px; max-width:1180px; width:100%; margin:0 auto;}

/* ---------- cards / generic ---------- */
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px; box-shadow:var(--shadow);}
.card-tight{padding:16px;}
.grid{display:grid; gap:16px;}
.section-title{display:flex; align-items:center; justify-content:space-between; margin:28px 0 12px;}
.section-title h2{font-size:19px; margin:0;}
.muted{color:var(--ink-soft);}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);}
.btn{
  display:inline-flex; align-items:center; gap:7px; justify-content:center;
  padding:10px 16px; border-radius:12px; border:1px solid transparent; cursor:pointer; font-weight:600; font-size:14px;
  transition:transform .12s ease, box-shadow .12s ease, background .15s ease, opacity .15s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent); color:var(--accent-ink);}
.btn-primary:hover{box-shadow:var(--shadow-lift);}
.btn-ghost{background:transparent; color:var(--ink); border-color:var(--border);}
.btn-ghost:hover{background:var(--bg-soft);}
.btn-soft{background:var(--accent-soft); color:var(--accent);}
.btn-danger{background:var(--danger-soft); color:var(--danger);}
.btn-icon{width:36px;height:36px;padding:0;border-radius:10px;background:transparent;color:var(--ink-soft);border:1px solid var(--border);}
.btn-icon:hover{background:var(--bg-soft); color:var(--ink);}
.btn[disabled]{opacity:.5; cursor:not-allowed;}
.icon-btn-plain{background:none;border:none;cursor:pointer;color:var(--ink-soft);padding:6px;border-radius:8px;display:flex;}
.icon-btn-plain:hover{background:var(--bg-soft); color:var(--ink);}
input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{
  width:100%; padding:10px 12px; border-radius:11px; border:1px solid var(--border); background:var(--card-2); color:var(--ink);
  font-family:inherit; font-size:14px;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent);}
textarea{resize:vertical; min-height:64px;}
label.field-label{font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; display:block;}
.field{margin-bottom:14px;}
.row{display:flex; gap:10px;}
.row > *{flex:1;}
hr.hair{border:none;border-top:1px solid var(--border); margin:14px 0;}

/* progress ring */
.ring-wrap{position:relative; width:132px; height:132px; flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none; stroke:var(--border); stroke-width:10;}
.ring-fg{fill:none; stroke:var(--accent); stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1);}
.ring-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.ring-center .big{font-family:'Fraunces',serif; font-size:26px; font-weight:600;}
.ring-center .small{font-size:11px; color:var(--ink-soft);}

.bar{height:9px; border-radius:99px; background:var(--bg-soft); overflow:hidden;}
.bar > span{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .5s ease;}

/* hero / greeting */
.hero{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap;}
.hero h1{font-size:30px; margin:0 0 4px;}
.hero .sub{color:var(--ink-soft); font-size:14.5px;}

.quote-card{background:linear-gradient(155deg,var(--accent-soft),var(--card)); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px 22px; position:relative;}
.quote-card p.qtext{font-family:'Fraunces',serif; font-size:18px; line-height:1.5; margin:0 0 8px; font-style:italic;}
.quote-card .qauthor{font-size:12.5px; color:var(--ink-soft); font-weight:600;}

/* task/habit list items */
.item-row{display:flex; align-items:center; gap:12px; padding:12px 6px; border-bottom:1px solid var(--border);}
.item-row:last-child{border-bottom:none;}
.checkbox{
  width:23px; height:23px; border-radius:8px; border:2px solid var(--border); flex-shrink:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:all .15s ease; background:var(--card-2);
}
.checkbox.done{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.checkbox svg{width:14px;height:14px;}
.item-title{font-weight:600; font-size:14.5px;}
.item-title.done{text-decoration:line-through; color:var(--ink-soft); font-weight:500;}
.item-meta{font-size:12px; color:var(--ink-soft); display:flex; gap:8px; margin-top:2px; flex-wrap:wrap;}
.tag{font-size:11px; font-weight:600; padding:2px 8px; border-radius:99px; background:var(--bg-soft); color:var(--ink-soft);}
.tag.prio-high{background:var(--danger-soft); color:var(--danger);}
.tag.prio-med{background:var(--clay-soft); color:var(--clay);}
.tag.prio-low{background:var(--accent-soft); color:var(--accent);}

.empty-state{text-align:center; padding:36px 12px; color:var(--ink-soft);}
.empty-state svg{width:34px;height:34px; margin-bottom:10px; opacity:.55;}
.empty-state .et-title{font-weight:600; color:var(--ink); font-family:'Fraunces',serif; font-size:16px; margin-bottom:3px;}

/* mood */
.mood-row{display:flex; gap:8px; justify-content:space-between;}
.mood-opt{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 4px; border-radius:14px; cursor:pointer; border:2px solid transparent; background:var(--bg-soft); transition:all .15s;}
.mood-opt.selected{border-color:var(--accent); background:var(--accent-soft);}
.mood-opt .emoji{font-size:22px;}
.mood-opt .lbl{font-size:11px; font-weight:600; color:var(--ink-soft);}

/* modal */
.overlay{position:fixed; inset:0; background:rgba(20,22,25,.45); backdrop-filter:blur(2px); display:flex; align-items:flex-end; justify-content:center; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s ease;}
.overlay.open{opacity:1; pointer-events:auto;}
@media(min-width:720px){.overlay{align-items:center;}}
.modal{background:var(--card); width:100%; max-width:480px; border-radius:22px 22px 0 0; padding:22px; max-height:88vh; overflow-y:auto; transform:translateY(16px); transition:transform .22s cubic-bezier(.2,.8,.3,1); box-shadow:var(--shadow-lift);}
.overlay.open .modal{transform:translateY(0);}
@media(min-width:720px){.modal{border-radius:22px; margin-bottom:0;}}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-head h3{margin:0; font-size:19px;}

/* toasts */
#toast-root{position:fixed; top:18px; right:18px; z-index:200; display:flex; flex-direction:column; gap:8px; max-width:320px;}
@media(max-width:719px){#toast-root{left:12px; right:12px; top:12px; max-width:none;}}
.toast{background:var(--ink); color:var(--bg); padding:12px 16px; border-radius:12px; font-size:13.5px; font-weight:500; box-shadow:var(--shadow-lift); display:flex; align-items:center; gap:10px; animation:toastIn .25s ease;}
[data-theme="dark"] .toast{background:var(--card); color:var(--ink); border:1px solid var(--border);}
@keyframes toastIn{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);}}

/* bottom nav (mobile) */
#bottomnav{display:none;}
@media(max-width:900px){
  #sidebar{display:none;}
  #view-root{padding:18px 16px 90px;}
  #bottomnav{
    display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--border);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom)); z-index:80; justify-content:space-around;
  }
  .bn-item{display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--ink-soft); font-size:10.5px; font-weight:600; padding:4px 8px; border-radius:10px;}
  .bn-item.active{color:var(--accent);}
  .bn-item svg{width:21px;height:21px;}
  #topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; position:sticky; top:0; background:var(--bg); z-index:50; border-bottom:1px solid var(--border);}
}

.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
@media(min-width:760px){ .cols-2{display:grid; grid-template-columns:1.3fr 1fr; gap:18px; align-items:start;} }
@media(max-width:759px){ .grid-2{grid-template-columns:1fr 1fr;} .grid-3{grid-template-columns:1fr 1fr;} }

.streak-flame{display:inline-flex; align-items:center; gap:3px; font-size:12px; font-weight:700; color:var(--clay);}
.chart-bars{display:flex; align-items:flex-end; gap:6px; height:90px;}
.chart-bars .cb{flex:1; background:var(--accent-soft); border-radius:6px 6px 2px 2px; position:relative; min-height:4px;}
.chart-bars .cb > span{position:absolute; inset:0; bottom:0; background:var(--accent); border-radius:6px 6px 2px 2px; transition:height .5s ease;}
.chart-bars .cb-label{font-size:10px; color:var(--ink-soft); text-align:center; margin-top:5px;}
.cb-label-standalone{font-size:10px; color:var(--ink-soft); text-align:center; margin-top:5px; display:block;}

.qty-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--card-2);color:var(--ink);font-size:17px;font-weight:700;cursor:pointer;}
.qty-btn:hover{background:var(--bg-soft);}

.timer-display{font-family:'Fraunces',serif; font-size:56px; text-align:center; font-weight:600; letter-spacing:-.02em; margin:6px 0;}
.segmented{display:flex; background:var(--bg-soft); border-radius:12px; padding:3px; gap:3px;}
.segmented button{flex:1; padding:8px; border:none; background:transparent; border-radius:9px; font-weight:600; font-size:13px; color:var(--ink-soft); cursor:pointer;}
.segmented button.active{background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08);}

.color-dot{width:26px;height:26px;border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0;}
.color-dot.selected{border-color:var(--ink);}

.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.cal-cell{aspect-ratio:1; border-radius:11px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; font-size:12.5px; font-weight:600; border:1px solid transparent; gap:3px; position:relative; background:var(--card-2);}
.cal-cell:hover{background:var(--bg-soft);}
.cal-cell.today{border-color:var(--accent);}
.cal-cell.selected{background:var(--accent); color:var(--accent-ink);}
.cal-cell.other-month{opacity:.32;}
.cal-dot{width:4px;height:4px;border-radius:50%; background:var(--clay);}
.cal-cell.selected .cal-dot{background:var(--accent-ink);}
.weekday-lbl{text-align:center; font-size:10.5px; color:var(--ink-soft); font-weight:700;}

.switch{position:relative; width:42px; height:24px; flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute; inset:0; background:var(--border); border-radius:99px; cursor:pointer; transition:.2s;}
.slider:before{content:""; position:absolute; width:18px;height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s;}
.switch input:checked + .slider{background:var(--accent);}
.switch input:checked + .slider:before{transform:translateX(18px);}

.linkline{display:flex; align-items:center; justify-content:space-between; padding:13px 4px; border-bottom:1px solid var(--border);}
.linkline:last-child{border-bottom:none;}

.fab{display:none;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:99px;}
.skeleton{background:linear-gradient(90deg,var(--bg-soft) 25%,var(--border) 37%,var(--bg-soft) 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; border-radius:8px;}
@keyframes sk{0%{background-position:100% 50%;}100%{background-position:0 50%;}}
/* ---------- cycle tracker ---------- */
.cyc-cell{aspect-ratio:1; border-radius:11px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; font-size:12.5px; font-weight:600; border:1px solid transparent; gap:2px; position:relative; background:var(--card-2); transition:background .15s ease;}
.cyc-cell:hover{background:var(--bg-soft);}
.cyc-cell.other-month{opacity:0; pointer-events:none;}
.cyc-cell.today{border-color:var(--ink); }
.cyc-cell.fertile{background:var(--cyc-fertile-soft); color:var(--cyc-fertile);}
.cyc-cell.pred{background:transparent; border:1px dashed var(--cyc-period); color:var(--cyc-period);}
.cyc-cell.period{background:var(--cyc-period-soft); color:var(--cyc-period); border-color:var(--cyc-period);}
.cyc-cell.ovul{box-shadow:inset 0 0 0 2px var(--cyc-fertile);}
.cyc-cell.selected{outline:2px solid var(--ink); outline-offset:1px;}
.cyc-dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.7;}
.cyc-legend{display:flex; flex-wrap:wrap; gap:12px; font-size:11.5px; color:var(--ink-soft); margin-top:14px;}
.cyc-legend span{display:inline-flex; align-items:center; gap:6px;}
.cyc-swatch{width:12px;height:12px;border-radius:4px;display:inline-block;flex-shrink:0;}
.chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.chip{border:1px solid var(--border); background:var(--card-2); color:var(--ink-soft); border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-family:inherit;}
.chip:hover{background:var(--bg-soft); color:var(--ink);}
.chip.on{background:var(--accent-soft); color:var(--accent); border-color:var(--accent);}
.chip.on-rose{background:var(--cyc-period-soft); color:var(--cyc-period); border-color:var(--cyc-period);}
</style>
</head>
<body>
<div id="shell">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark" id="brand-mark-icon"></div>
      <div class="brand-name">My Day Buddy</div>
    </div>
    <nav id="nav-list"></nav>
    <div class="sidebar-foot">
      <div class="avatar" id="side-avatar"></div>
      <div style="min-width:0;">
        <div style="font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" id="side-name"></div>
        <div style="font-size:11.5px; color:var(--ink-soft);" id="side-date"></div>
      </div>
    </div>
  </aside>
  <div id="main">
    <div id="topbar">
      <div style="display:flex;align-items:center;gap:9px;">
        <div class="brand-mark" style="width:28px;height:28px;" id="topbar-mark"></div>
        <span class="brand-name" style="font-size:16px;">My Day Buddy</span>
      </div>
      <button class="btn-icon" id="topbar-theme"></button>
    </div>
    <div id="view-root"></div>
  </div>
</div>
<nav id="bottomnav"></nav>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
/* =========================================================
   MY DAY BUDDY — Daily Life Tracker
   Single-file app. Vanilla JS + localStorage. No build step.
   ========================================================= */
(function(){
"use strict";

/* ---------------- constants ---------------- */
const STORAGE_KEY = "daybook_state_v1";
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const ACCENTS = ["#4F7A68","#3E6C93","#8A5FA8","#C1543C","#C99A3E","#4F8FA6","#7A6FD4","#4F7A68"];
const QUOTES = [
["The secret of getting ahead is getting started.","Mark Twain"],
["Small daily improvements are the key to staggering long-term results.","Robin Sharma"],
["You do not rise to the level of your goals. You fall to the level of your systems.","James Clear"],
["Discipline is choosing between what you want now and what you want most.","Abraham Lincoln"],
["What you do every day matters more than what you do once in a while.","Gretchen Rubin"],
["The days are long, but the decades are short.","Sam Altman"],
["Take care of your body. It's the only place you have to live.","Jim Rohn"],
["A calm mind brings inner strength and self-confidence.","Dalai Lama"],
["You don't have to be extreme, just consistent.","Unknown"],
["Rest is not idleness.","John Lubbock"],
["The quieter you become, the more you can hear.","Rumi"],

/* ---------------- date helpers ---------------- */
function todayKey(d){ d = d || new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(key, n){ const [y,m,d] = key.split("-").map(Number); const dt = new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return todayKey(dt); }
function fmtDateLong(key){ const [y,m,d]=key.split("-").map(Number); return MONTHS[m-1]+" "+d+", "+y; }
function fmtTime12(hhmm){ if(!hhmm) return ""; let [h,m]=hhmm.split(":").map(Number); const ap = h>=12?"PM":"AM"; h = h%12; if(h===0)h=12; return h+":"+String(m).padStart(2,"0")+" "+ap; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function lastNDays(n){ const arr=[]; for(let i=n-1;i>=0;i--) arr.push(addDays(todayKey(),-i)); return arr; }

let state = load();
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    // shallow-merge with defaults for forward-compat
    const def = defaultState();
    // returning users (any existing saved state) shouldn't see the onboarding wizard
    // just because it's a newly added field — only truly fresh installs get it.
    if(parsed.onboarded === undefined) parsed.onboarded = true;
    return Object.assign({}, def, parsed, {
      user:Object.assign({},def.user, parsed.user||{}),
      settings:Object.assign({},def.settings, parsed.settings||{}),
      cycle:Object.assign({}, def.cycle, parsed.cycle||{}),
    });
  }catch(e){ console.warn("load failed, resetting", e); return defaultState(); }
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ console.warn("save failed", e); }
    try{ if(typeof syncNativeNotifications==="function") syncNativeNotifications(); }catch(e){}
  }, 120);
}

function openModal(innerHtml, opts){
  opts = opts || {};
  const root = document.getElementById("modal-root");
  root.innerHTML = `<div class="overlay" id="ov"><div class="modal">${innerHtml}</div></div>`;
  const ov = document.getElementById("ov");
  if(!opts.locked) ov.addEventListener("click", (e)=>{ if(e.target.id==="ov") closeModal(); });
  requestAnimationFrame(()=>ov.classList.add("open"));
  mountIcons();
}
function closeModal(){
  const ov = document.getElementById("ov");
  if(!ov) return;
  ov.classList.remove("open");
  setTimeout(()=>{ document.getElementById("modal-root").innerHTML=""; }, 200);
}

function greeting(){
  const h = new Date().getHours();
  if(h<12) return "Good morning";
  if(h<17) return "Good afternoon";
  return "Good evening";
}
function dayCompletionPct(dateKey){
  dateKey = dateKey || todayKey();
  let total=0, done=0;
  const dayTasks = state.tasks.filter(t=>t.date===dateKey);
  total += dayTasks.length; done += dayTasks.filter(t=>t.completed).length;
  total += state.habits.length; done += state.habits.filter(h=> (state.habitLogs[dateKey]||{})[h.id]).length;
  const waterGoal = state.settings.waterGoalMl; const waterVal = (state.water.logs[dateKey]||0);
  total += 1; if(waterVal>=waterGoal) done+=1; else done += clamp(waterVal/waterGoal,0,1);
  if(total===0) return 0;
  return clamp(Math.round((done/total)*100),0,100);
}
function currentQuote(){
  const dk = todayKey();
  if(state.quoteIndexByDate[dk]===undefined){
    state.quoteIndexByDate[dk] = Math.floor(Math.random()*QUOTES.length); save();
  }
  return QUOTES[state.quoteIndexByDate[dk]];
}
function refreshQuote(){
  const dk = todayKey();
  let idx;
  do{ idx = Math.floor(Math.random()*QUOTES.length); } while(idx===state.quoteIndexByDate[dk] && QUOTES.length>1);
  state.quoteIndexByDate[dk]=idx; save(); renderHome();
}

}

function ringSvg(pct, size, strokeW){
  size = size||132; strokeW = strokeW||10;
  const r = (size-strokeW)/2; const c = 2*Math.PI*r; const off = c - (pct/100)*c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${strokeW}"></circle>
    <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${strokeW}" stroke-dasharray="${c}" stroke-dashoffset="${off}"></circle>
  </svg>`;
}

/* ---------------- dashboard customization ---------------- */
const DASHBOARD_SECTIONS = [
  {id:"quote", label:"Daily Quote", icon:"quote", zone:"top"},
  {id:"tasks", label:"Today's Tasks", icon:"check-square", zone:"left"},
  {id:"habits", label:"Habits", icon:"repeat", zone:"left"},
  {id:"goals", label:"Goals", icon:"target", zone:"left"},
  {id:"water", label:"Water Tracker", icon:"droplets", zone:"right"},
  {id:"mood", label:"Mood Check-in", icon:"smile", zone:"right"},
  {id:"focus", label:"Focus Timer", icon:"timer", zone:"right"},
  {id:"cycle", label:"Cycle Summary", icon:"droplet", zone:"right"},
];
function defaultDashboardLayout(){ return DASHBOARD_SECTIONS.map(s=>({id:s.id, enabled:true})); }
function getDashboardLayout(){
  if(!state.dashboardLayout || !Array.isArray(state.dashboardLayout) || state.dashboardLayout.length===0){
    state.dashboardLayout = defaultDashboardLayout();
  }
  // forward-compat: add any new known sections that aren't present yet
  DASHBOARD_SECTIONS.forEach(s=>{
    if(!state.dashboardLayout.some(l=>l.id===s.id)) state.dashboardLayout.push({id:s.id, enabled:true});
  });
  return state.dashboardLayout;
}
function openDashboardCustomizeModal(){
  const layout = getDashboardLayout();
  openModal(`
    <div class="modal-head"><h3>Customize Dashboard</h3><button class="icon-btn-plain" onclick="__closeModal()">${icon("x",20)}</button></div>
    <p class="muted" style="font-size:13px; margin-top:-6px; margin-bottom:14px;">Show, hide, or reorder what appears on your Home screen.</p>
    <div id="dash-cust-list"></div>
    <div class="row" style="margin-top:16px;">
      <button class="btn btn-ghost" id="dash-cust-reset">${icon("rotate-ccw",15)} Reset to Default</button>
      <button class="btn btn-primary" id="dash-cust-done" style="flex:2;">Done</button>
    </div>
  `);
  renderDashCustList();
  document.getElementById("dash-cust-reset").onclick = ()=>{
    state.dashboardLayout = defaultDashboardLayout(); save(); renderDashCustList(); rerenderCurrent();
  };
  document.getElementById("dash-cust-done").onclick = closeModal;
}
function renderDashCustList(){
  const listEl = document.getElementById("dash-cust-list");
  if(!listEl) return;
  const layout = getDashboardLayout();
  const visible = layout.filter(it=> it.id!=="cycle" || cycleEnabled());
  listEl.innerHTML = visible.map((item,i)=>{
    const meta = DASHBOARD_SECTIONS.find(s=>s.id===item.id) || {label:item.id, icon:"circle"};
    return `<div class="linkline" data-row="${item.id}">
      <span style="display:flex; align-items:center; gap:10px; font-weight:600; font-size:13.5px; ${item.enabled?'':'color:var(--ink-faint);'}">${icon(meta.icon,16)} ${meta.label}</span>
      <span style="display:flex; align-items:center; gap:4px;">
        <button class="icon-btn-plain" data-move="up" data-id="${item.id}" ${i===0?'disabled style="opacity:.3;"':''}>${icon("chevron-up",16)}</button>
        <button class="icon-btn-plain" data-move="down" data-id="${item.id}" ${i===visible.length-1?'disabled style="opacity:.3;"':''}>${icon("chevron-down",16)}</button>
        <label class="switch" style="margin-left:6px;"><input type="checkbox" data-toggle-section="${item.id}" ${item.enabled?'checked':''}/><span class="slider"></span></label>
      </span>
    </div>`;
  }).join("");
  listEl.querySelectorAll("[data-toggle-section]").forEach(el=> el.onchange = ()=>{
    const it = layout.find(l=>l.id===el.dataset.toggleSection);
    it.enabled = el.checked; save(); renderDashCustList(); rerenderCurrent();
  });
  listEl.querySelectorAll("[data-move]").forEach(el=> el.onclick = ()=>{
    if(el.disabled) return;
    const idx = layout.findIndex(l=>l.id===el.dataset.id);
    const dir = el.dataset.move==="up"?-1:1;
    let swapIdx = idx+dir;
    while(swapIdx>=0 && swapIdx<layout.length && !visible.includes(layout[swapIdx])) swapIdx += dir;
    if(swapIdx<0 || swapIdx>=layout.length) return;
    [layout[idx], layout[swapIdx]] = [layout[swapIdx], layout[idx]];
    save(); renderDashCustList(); rerenderCurrent();
  });
  mountIcons();
}
function emptyState(iconName,title,body){
  return `<div class="empty-state">${icon(iconName,30)}<div class="et-title">${escapeHtml(title)}</div><div>${escapeHtml(body)}</div></div>`;
}

/* ---------- habit chip (home) ---------- */
function habitChipHtml(h, dateKey){
  const done = !!(state.habitLogs[dateKey]||{})[h.id];
  const streak = habitStreak(h.id, dateKey);
  return `<div style="text-align:center;">
    <button class="checkbox ${done?'done':''}" style="width:52px;height:52px;border-radius:16px;margin:0 auto 6px;" data-habit-toggle="${h.id}">
      ${icon(h.icon||"circle", 22)}
    </button>
    <div style="font-size:11.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(h.name)}</div>
    ${streak>0?`<div class="streak-flame">${icon("flame",11)} ${streak}</div>`:""}
  </div>`;
}
function bindHabitChipEvents(root, dateKey){
  root.querySelectorAll("[data-habit-toggle]").forEach(el=> el.onclick = ()=>{
    const id = el.dataset.habitToggle;
    state.habitLogs[dateKey] = state.habitLogs[dateKey] || {};
    const now = !state.habitLogs[dateKey][id];
    state.habitLogs[dateKey][id] = now;
    save(); rerenderCurrent();
    if(now) toast("Habit checked off","flame");
  });
}
function habitStreak(habitId, fromDateKey){
  let streak=0, d = fromDateKey;
  while(true){
    const log = state.habitLogs[d];
    if(log && log[habitId]){ streak++; d = addDays(d,-1); } else break;
  }
  return streak;
}

function pomodoroWidgetHtml(){
  const mm = String(Math.floor(ui.pomodoro.remaining/60)).padStart(2,"0");
  const ss = String(ui.pomodoro.remaining%60).padStart(2,"0");
  const linked = ui.pomodoro.activeSessionId ? state.focusSessions.find(s=>s.id===ui.pomodoro.activeSessionId) : null;
  return `
    <div class="segmented" style="margin-bottom:10px;">
      <button data-pmode="focus" class="${ui.pomodoro.mode==='focus'?'active':''}">Focus</button>
      <button data-pmode="break" class="${ui.pomodoro.mode==='break'?'active':''}">Break</button>
    </div>
    <div class="timer-display mono" id="pomo-display">${mm}:${ss}</div>
    ${linked?`<div class="pill" style="display:flex; justify-content:center; margin:0 auto 10px; width:fit-content;">${icon("link",11)} ${escapeHtml(linked.label)}</div>`:""}
    <div class="row">
      <button class="btn btn-primary" id="pomo-startpause">${icon(ui.pomodoro.running?"pause":"play",15)} ${ui.pomodoro.running?"Pause":"Start"}</button>
      <button class="btn-icon" id="pomo-reset">${icon("rotate-ccw",16)}</button>
    </div>
    <div class="muted" style="font-size:11.5px; margin-top:8px; text-align:center;">Today's focus time: <span class="mono">${todayFocusMinutes()}m</span></div>
  `;
}
function todayFocusMinutes(){
  const s = state.pomodoro.sessions[todayKey()] || 0; return s;
}
function mountPomodoroWidget(){
  const root = document.getElementById("view-root");
  const modeBtns = root.querySelectorAll("[data-pmode]");
  modeBtns.forEach(b=> b.onclick = ()=>{
    pomoStop();
    ui.pomodoro.activeSessionId = null;
    ui.pomodoro.mode = b.dataset.pmode;
    ui.pomodoro.remaining = (ui.pomodoro.mode==="focus"?state.settings.pomodoroFocusMin:state.settings.pomodoroBreakMin)*60;
    refreshFullPomo();
  });
  const sp = root.querySelector("#pomo-startpause");
  if(sp) sp.onclick = ()=> ui.pomodoro.running ? pomoStop() : pomoStart();
  const rs = root.querySelector("#pomo-reset");
  if(rs) rs.onclick = ()=>{ pomoStop(); ui.pomodoro.activeSessionId=null; ui.pomodoro.remaining = (ui.pomodoro.mode==="focus"?state.settings.pomodoroFocusMin:state.settings.pomodoroBreakMin)*60; refreshFullPomo(); };
}
function pomoStart(){
  ui.pomodoro.running = true;
  ui.pomodoro.interval = setInterval(()=>{
    ui.pomodoro.remaining--;
    if(ui.pomodoro.remaining<=0){
      pomoStop();
      if(ui.pomodoro.mode==="focus"){
        const dk = todayKey();
        const minutesRun = Math.round((ui.pomodoro.mode==="focus"?state.settings.pomodoroFocusMin:0));
        state.pomodoro.sessions[dk] = (state.pomodoro.sessions[dk]||0) + minutesRun;
        if(ui.pomodoro.activeSessionId){
          const sess = state.focusSessions.find(s=>s.id===ui.pomodoro.activeSessionId);
          if(sess) sess.completed = true;
          ui.pomodoro.activeSessionId = null;
        }
        save();
        notify("Focus session complete","Nice work — time for a break.");
      } else {
        notify("Break's over","Ready for another focus session?");
      }
      ui.pomodoro.remaining = (ui.pomodoro.mode==="focus"?state.settings.pomodoroBreakMin:state.settings.pomodoroFocusMin)*60;
      ui.pomodoro.mode = ui.pomodoro.mode==="focus"?"break":"focus";
      refreshFullPomo();
      return;
    }
    refreshPomoDisplay();
  }, 1000);
  refreshFullPomo();
}
function pomoStop(){ ui.pomodoro.running=false; clearInterval(ui.pomodoro.interval); refreshFullPomo(); }
function refreshPomoDisplay(){
  const el = document.getElementById("pomo-display"); if(!el) return;
  const mm = String(Math.floor(ui.pomodoro.remaining/60)).padStart(2,"0");
  const ss = String(ui.pomodoro.remaining%60).padStart(2,"0");
  el.textContent = mm+":"+ss;
}
function refreshFullPomo(){
  if(ui.route==="home" || ui.route==="health" || ui.route==="focus"){ render(); }
}

      <button class="btn btn-primary" id="tf-save" style="flex:2;">${editing?"Save Changes":"Add Task"}</button>
    </div>
  `);

      priority: document.getElementById("tf-prio").value,

        state.tasks = state.tasks.filter(t=>t.id!==editing.id); save(); closeModal(); rerenderCurrent();

/* =========================================================
   VIEW: GOALS  (projects / study goals with topics + progress)
   ========================================================= */
function goalProgress(g){
  if(g.topics && g.topics.length>0){
    return Math.round(g.topics.filter(t=>t.done).length / g.topics.length * 100);
  }
  return clamp(g.progress||0, 0, 100);
}
function goalTypeMeta(id){ return GOAL_TYPES.find(t=>t.id===id) || GOAL_TYPES[GOAL_TYPES.length-1]; }
function goalStatusMeta(id){ return GOAL_STATUSES.find(s=>s.id===id) || GOAL_STATUSES[0]; }
function renderGoals(){
  const root = document.getElementById("view-root");
  const goals = state.goals.slice().sort((a,b)=>{
    if(a.status==="done" && b.status!=="done") return 1;
    if(b.status==="done" && a.status!=="done") return -1;
    return (a.deadline||"9999").localeCompare(b.deadline||"9999");
  });
  root.innerHTML = `
    <div class="hero"><div><h1>Goals</h1><div class="sub">Projects and study goals, tracked over time.</div></div>
      <button class="btn btn-primary" id="add-goal-btn">${icon("plus",16)} New Goal</button>
    </div>
    <div class="grid" style="margin-top:18px; gap:16px;">
      ${goals.length ? goals.map(goalCardHtml).join("") : `<div class="card">${emptyState("target","No goals yet","Add a project or study goal to start tracking progress.")}</div>`}
    </div>
  `;
  document.getElementById("add-goal-btn").onclick = ()=>openGoalModal();
  bindGoalCardEvents(root);
  mountIcons();
}
function goalCardHtml(g){
  const meta = goalTypeMeta(g.type);
  const statusMeta = goalStatusMeta(g.status);
  const pct = goalProgress(g);
  const daysLeft = g.deadline ? Math.round((new Date(g.deadline+"T00:00") - new Date(todayKey()+"T00:00"))/86400000) : null;
  return `<div class="card" data-goal="${g.id}">
    <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px;">
      <div style="min-width:0;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:3px;">
          <span class="tag">${icon(meta.icon,11)} ${meta.label}</span>
          <span class="tag" style="background:color-mix(in srgb, ${statusMeta.color} 18%, transparent); color:${statusMeta.color};">${statusMeta.label}</span>
        </div>
        <div style="font-family:'Fraunces',serif; font-weight:600; font-size:17px;">${escapeHtml(g.title)}</div>
        ${g.deadline?`<div class="muted" style="font-size:12px; margin-top:2px;">${icon("calendar",11)} ${fmtDateLong(g.deadline)} ${daysLeft!==null?(daysLeft>=0?`· ${daysLeft}d left`:`· ${Math.abs(daysLeft)}d overdue`):''}</div>`:''}
      </div>
      <div style="display:flex; gap:4px; flex-shrink:0;">
        <button class="icon-btn-plain" data-edit-goal="${g.id}">${icon("pencil",15)}</button>
        <button class="icon-btn-plain" data-del-goal="${g.id}">${icon("trash-2",15)}</button>
      </div>
    </div>
    <div class="bar" style="margin-bottom:6px;"><span style="width:${pct}%; background:${statusMeta.color};"></span></div>
    <div class="muted mono" style="font-size:11.5px; margin-bottom:12px;">${pct}% complete</div>
    ${g.topics && g.topics.length ? `
      <div>
        ${g.topics.map(t=>`
          <div class="item-row" style="padding:8px 2px;">
            <div class="checkbox ${t.done?'done':''}" style="width:20px;height:20px;" data-toggle-topic="${g.id}|${t.id}">${t.done?icon('check',12):''}</div>
            <div class="item-title ${t.done?'done':''}" style="font-size:13px; flex:1;">${escapeHtml(t.title)}</div>
            <button class="icon-btn-plain" style="padding:3px;" data-del-topic="${g.id}|${t.id}">${icon("x",13)}</button>
          </div>
        `).join("")}
      </div>
      <div class="row" style="margin-top:8px;">
        <input type="text" placeholder="Add a topic / milestone..." data-newtopic="${g.id}" />
        <button class="btn-icon" data-addtopic-btn="${g.id}">${icon("plus",16)}</button>
      </div>
    ` : `
      <div class="row" style="margin-top:4px;">
        <input type="text" placeholder="Add a topic / milestone (optional)..." data-newtopic="${g.id}" />
        <button class="btn-icon" data-addtopic-btn="${g.id}">${icon("plus",16)}</button>
      </div>
    `}
  </div>`;
}
function bindGoalCardEvents(root){
  root.querySelectorAll("[data-edit-goal]").forEach(b=> b.onclick = ()=> openGoalModal(b.dataset.editGoal));
  root.querySelectorAll("[data-del-goal]").forEach(b=> b.onclick = ()=>{
    confirmAction("Delete goal?","This removes it and all its topics.", ()=>{
      state.goals = state.goals.filter(g=>g.id!==b.dataset.delGoal); save(); rerenderCurrent();
    });
  });
  root.querySelectorAll("[data-toggle-topic]").forEach(b=> b.onclick = ()=>{
    const [gid,tid] = b.dataset.toggleTopic.split("|");
    const g = state.goals.find(x=>x.id===gid); const t = g.topics.find(x=>x.id===tid);
    t.done = !t.done; save(); rerenderCurrent();
  });
  root.querySelectorAll("[data-del-topic]").forEach(b=> b.onclick = ()=>{
    const [gid,tid] = b.dataset.delTopic.split("|");
    const g = state.goals.find(x=>x.id===gid);
    g.topics = g.topics.filter(x=>x.id!==tid); save(); rerenderCurrent();
  });
  root.querySelectorAll("[data-addtopic-btn]").forEach(b=> {
    const gid = b.dataset.addtopicBtn;
    const doAdd = ()=>{
      const input = root.querySelector(`[data-newtopic="${gid}"]`);
      const v = input.value.trim(); if(!v) return;
      const g = state.goals.find(x=>x.id===gid);
      g.topics = g.topics||[];
      g.topics.push({id:uid(), title:v, done:false});
      save(); rerenderCurrent();
    };
    b.onclick = doAdd;
    const input = root.querySelector(`[data-newtopic="${gid}"]`);
    if(input) input.onkeydown = e=>{ if(e.key==="Enter") doAdd(); };
  });
}
function openGoalModal(goalId){
  const editing = goalId ? state.goals.find(g=>g.id===goalId) : null;
  openModal(`
    <div class="modal-head"><h3>${editing?"Edit Goal":"New Goal"}</h3><button class="icon-btn-plain" onclick="__closeModal()">${icon("x",20)}</button></div>
    <div class="field"><label class="field-label">Title</label><input type="text" id="gf-title" value="${editing?escapeHtml(editing.title):''}" placeholder="e.g. Launch office project, Prepare for exam"/></div>
    <div class="field"><label class="field-label">Type</label>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        ${GOAL_TYPES.map(t=>`<button class="btn-icon" data-gtype="${t.id}" style="width:auto;padding:0 12px;gap:6px;display:inline-flex;align-items:center;${(editing?editing.type:GOAL_TYPES[0].id)===t.id?'background:var(--accent-soft);color:var(--accent);border-color:var(--accent);':''}">${icon(t.icon,15)} ${t.label}</button>`).join("")}
      </div>
    </div>
    <div class="row field">

  document.querySelectorAll("[data-gtype]").forEach(b=> b.onclick = ()=>{

    b.style.cssText = "width:auto;padding:0 12px;gap:6px;display:inline-flex;align-items:center;background:var(--accent-soft);color:var(--accent);border-color:var(--accent);";
  });
  document.getElementById("gf-save").onclick = ()=>{
    const title = document.getElementById("gf-title").value.trim();
    if(!title){ toast("Give the goal a title"); return; }
    const data = { title, type:selectedType, deadline: document.getElementById("gf-deadline").value, status: document.getElementById("gf-status").value };
    if(editing){ Object.assign(editing, data); toast("Goal updated","check"); }
    else{ state.goals.push(Object.assign({id:uid(), progress:0, topics:[], createdAt:todayKey()}, data)); toast("Goal created","target"); }
    save(); closeModal(); rerenderCurrent();
  };
  if(editing){
    document.getElementById("gf-delete").onclick = ()=>{
      confirmAction("Delete goal?","This removes it and all its topics.", ()=>{
        state.goals = state.goals.filter(g=>g.id!==editing.id); save(); closeModal(); rerenderCurrent();
      });
    };
  }
}

/* =========================================================
   VIEW: FOCUS  (timer + bookable time-slot sessions)
   ========================================================= */
function renderFocus(){
  const root = document.getElementById("view-root");
  const today = todayKey();
  const todaySessions = state.focusSessions.filter(s=>s.date===today).sort((a,b)=> (a.startTime||"").localeCompare(b.startTime||""));
  const weekMinutes = lastNDays(7).reduce((sum,d)=> sum + (state.pomodoro.sessions[d]||0), 0);

  root.innerHTML = `
    <div class="hero"><div><h1>Focus</h1><div class="sub">Run the timer, or book a dedicated time slot.</div></div></div>

    <div class="cols-2" style="margin-top:18px;">
      <div>
        <div class="card" style="text-align:center;">
          <div style="font-weight:700; font-size:14px; margin-bottom:2px; display:flex; align-items:center; justify-content:center; gap:6px;">${icon("timer",16)} Timer</div>
          <div class="muted" style="font-size:12px; margin-bottom:14px;">Adjust duration before starting</div>
          ${pomodoroWidgetHtml()}
          <div class="row" style="margin-top:16px;">
            <div>
              <label class="field-label">Focus (min)</label>
              <div class="row" style="align-items:center;">
                <button class="qty-btn" id="focus-min-dec" ${ui.pomodoro.running?'disabled':''}>−</button>
                <input type="number" id="focus-min-input" value="${state.settings.pomodoroFocusMin}" style="text-align:center;" ${ui.pomodoro.running?'disabled':''}/>
                <button class="qty-btn" id="focus-min-inc" ${ui.pomodoro.running?'disabled':''}>+</button>
              </div>
            </div>
            <div>
              <label class="field-label">Break (min)</label>
              <div class="row" style="align-items:center;">
                <button class="qty-btn" id="break-min-dec" ${ui.pomodoro.running?'disabled':''}>−</button>
                <input type="number" id="break-min-input" value="${state.settings.pomodoroBreakMin}" style="text-align:center;" ${ui.pomodoro.running?'disabled':''}/>
                <button class="qty-btn" id="break-min-inc" ${ui.pomodoro.running?'disabled':''}>+</button>
              </div>
            </div>
          </div>
        </div>

        <div class="grid grid-2" style="margin-top:16px;">
          <div class="card card-tight"><div class="muted" style="font-size:11.5px;">Today's focus</div><div class="display" style="font-size:24px;">${todayFocusMinutes()}m</div></div>
          <div class="card card-tight"><div class="muted" style="font-size:11.5px;">Last 7 days</div><div class="display" style="font-size:24px;">${Math.round(weekMinutes/60*10)/10}h</div></div>
        </div>
      </div>

      <div>
        <div class="section-title" style="margin-top:0;"><h2>Today's Sessions</h2><button class="btn btn-soft" id="book-session-btn">${icon("calendar-plus",15)} Book Slot</button></div>
        <div class="card">
          ${todaySessions.length ? todaySessions.map(sessionRowHtml).join("") : emptyState("calendar-clock","Nothing booked","Book a study or Pomodoro slot to plan your day.")}
        </div>
      </div>
    </div>
  `;
  mountPomodoroWidget();
  document.getElementById("focus-min-dec").onclick = ()=>adjustDuration("focus",-5);
  document.getElementById("focus-min-inc").onclick = ()=>adjustDuration("focus",5);
  document.getElementById("break-min-dec").onclick = ()=>adjustDuration("break",-5);
  document.getElementById("break-min-inc").onclick = ()=>adjustDuration("break",5);
  document.getElementById("focus-min-input").onchange = e=>{ state.settings.pomodoroFocusMin = clamp(parseInt(e.target.value,10)||25,1,180); if(ui.pomodoro.mode==="focus") ui.pomodoro.remaining = state.settings.pomodoroFocusMin*60; save(); renderFocus(); };
  document.getElementById("break-min-input").onchange = e=>{ state.settings.pomodoroBreakMin = clamp(parseInt(e.target.value,10)||5,1,60); if(ui.pomodoro.mode==="break") ui.pomodoro.remaining = state.settings.pomodoroBreakMin*60; save(); renderFocus(); };
  document.getElementById("book-session-btn").onclick = ()=>openFocusSessionModal();
  bindFocusSessionEvents(root);
  mountIcons();
}
function adjustDuration(which, delta){
  if(ui.pomodoro.running) return;
  const key = which==="focus"?"pomodoroFocusMin":"pomodoroBreakMin";
  state.settings[key] = clamp((state.settings[key]||25)+delta, 1, 180);
  if(ui.pomodoro.mode===which) ui.pomodoro.remaining = state.settings[key]*60;
  save(); renderFocus();
}
function sessionTypeMeta(typeId){ return SESSION_TYPES.find(t=>t.id===typeId) || SESSION_TYPES[SESSION_TYPES.length-1]; }
function sessionRowHtml(s){
  const meta = sessionTypeMeta(s.type);
  const endMin = timeToMinutes(s.startTime) + s.duration;
  const endTime = minutesToTime(endMin);
  return `<div class="item-row" data-session="${s.id}">
    <div class="checkbox ${s.completed?'done':''}" data-toggle-session="${s.id}">${s.completed?icon("check",13):""}</div>
    <div style="flex:1; min-width:0;">
      <div class="item-title ${s.completed?'done':''}">${escapeHtml(s.label||meta.label)}</div>
      <div class="item-meta">
        <span class="tag">${icon(meta.icon,11)} ${meta.label}</span>
        <span>${icon("clock",11)} ${fmtTime12(s.startTime)}–${fmtTime12(endTime)}</span>
        <span>${s.duration}m</span>
      </div>
    </div>
    ${!s.completed?`<button class="icon-btn-plain" data-start-session="${s.id}" title="Start in timer">${icon("play",16)}</button>`:""}
    <button class="icon-btn-plain" data-del-session="${s.id}">${icon("trash-2",15)}</button>
  </div>`;
}
function timeToMinutes(hhmm){ if(!hhmm) return 0; const [h,m]=hhmm.split(":").map(Number); return h*60+m; }
function minutesToTime(total){ total = ((total%1440)+1440)%1440; const h=Math.floor(total/60), m=total%60; return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"); }
function bindFocusSessionEvents(root){
  root.querySelectorAll("[data-toggle-session]").forEach(b=> b.onclick = ()=>{
    const s = state.focusSessions.find(x=>x.id===b.dataset.toggleSession);
    s.completed = !s.completed; save(); renderFocus();
  });
  root.querySelectorAll("[data-start-session]").forEach(b=> b.onclick = ()=>{
    const s = state.focusSessions.find(x=>x.id===b.dataset.startSession);
    startSessionInTimer(s);
  });
  root.querySelectorAll("[data-del-session]").forEach(b=> b.onclick = ()=>{
    confirmAction("Delete session?","This removes the booked slot.", ()=>{
      state.focusSessions = state.focusSessions.filter(x=>x.id!==b.dataset.delSession); save(); renderFocus();
    });
  });
}
function startSessionInTimer(session){
  pomoStop();
  ui.pomodoro.mode = "focus";
  ui.pomodoro.remaining = session.duration*60;
  ui.pomodoro.activeSessionId = session.id;
  pomoStart();
  toast("Timer started for "+(session.label||sessionTypeMeta(session.type).label),"play");
}
function openFocusSessionModal(){
  const nowPlus = minutesToTime(timeToMinutes(String(new Date().getHours()).padStart(2,"0")+":"+String(new Date().getMinutes()).padStart(2,"0")) + 15);
  openModal(`
    <div class="modal-head"><h3>Book a Focus Session</h3><button class="icon-btn-plain" onclick="__closeModal()">${icon("x",20)}</button></div>
    <div class="field"><label class="field-label">Type</label>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        ${SESSION_TYPES.map((t,i)=>`<button class="btn-icon" data-stype="${t.id}" style="width:auto;padding:0 12px;gap:6px;display:inline-flex;align-items:center;${i===0?'background:var(--accent-soft);color:var(--accent);border-color:var(--accent);':''}">${icon(t.icon,15)} ${t.label}</button>`).join("")}
      </div>
    </div>
    <div class="field"><label class="field-label">Label (optional)</label><input type="text" id="sf-label" placeholder="e.g. Chapter 4 revision"/></div>
    <div class="row field">
      <div><label class="field-label">Start time</label><input type="time" id="sf-start" value="${nowPlus}"/></div>
      <div><label class="field-label">Duration (min)</label><input type="number" id="sf-duration" value="25" min="5" step="5"/></div>
    </div>
    <button class="btn btn-primary" id="sf-save" style="width:100%;">${icon("calendar-plus",15)} Book Session</button>
  `);
  let selectedType = SESSION_TYPES[0].id;
  document.querySelectorAll("[data-stype]").forEach(b=> b.onclick = ()=>{
    selectedType = b.dataset.stype;
    document.querySelectorAll("[data-stype]").forEach(x=>x.style.cssText="width:auto;padding:0 12px;gap:6px;display:inline-flex;align-items:center;");
    b.style.cssText = "width:auto;padding:0 12px;gap:6px;display:inline-flex;align-items:center;background:var(--accent-soft);color:var(--accent);border-color:var(--accent);";
  });
  document.getElementById("sf-save").onclick = ()=>{
    const duration = clamp(parseInt(document.getElementById("sf-duration").value,10)||25, 5, 480);
    const startTime = document.getElementById("sf-start").value || nowPlus;
    const label = document.getElementById("sf-label").value.trim();
    state.focusSessions.push({id:uid(), date:todayKey(), type:selectedType, label, startTime, duration, completed:false});
    save(); closeModal(); rerenderCurrent(); toast("Session booked","calendar-plus");
  };
}

/* =========================================================
   DEVICE STORAGE  (IndexedDB for photos/voice notes — localStorage
   only holds ~5-10MB, media needs real device-scale storage)
   ========================================================= */
const MEDIA_DB_NAME = "daybook_media";
const MEDIA_STORE = "blobs";
let mediaDbPromise = null;
function openMediaDb(){
  if(mediaDbPromise) return mediaDbPromise;
  mediaDbPromise = new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error("IndexedDB not supported")); return; }
    const req = indexedDB.open(MEDIA_DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(MEDIA_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return mediaDbPromise;
}
async function mediaPut(id, blob){
  const db = await openMediaDb();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(MEDIA_STORE, "readwrite");
    tx.objectStore(MEDIA_STORE).put(blob, id);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function mediaGet(id){
  const db = await openMediaDb();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(MEDIA_STORE, "readonly");
    const req = tx.objectStore(MEDIA_STORE).get(id);
    req.onsuccess = ()=>resolve(req.result || null);
    req.onerror = ()=>reject(req.error);
  });
}
async function mediaDelete(id){
  const db = await openMediaDb();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(MEDIA_STORE, "readwrite");
    tx.objectStore(MEDIA_STORE).delete(id);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
const mediaUrlCache = new Map(); // mediaId -> blob object URL, populated lazily
function mediaUrl(id){ return mediaUrlCache.get(id) || ""; }
async function ensureMediaUrls(ids){
  let changed = false;
  for(const id of ids){
    if(!id || mediaUrlCache.has(id)) continue;
    try{
      const blob = await mediaGet(id);
      if(blob){ mediaUrlCache.set(id, URL.createObjectURL(blob)); changed = true; }
    }catch(e){ /* skip individual failures, rest still render */ }
  }
  return changed;
}
// One-time migration: earlier versions stored photos/voice notes as giant
// base64 strings directly in localStorage. Move any of those into IndexedDB
// so old data keeps working under the new, much larger storage limit.
async function migrateBase64MediaToIndexedDB(){
  let didMigrate = false;
  for(const dateKey of Object.keys(state.journal.entries)){
    const entry = state.journal.entries[dateKey];
    for(const field of ['images','voiceNotes']){
      const arr = entry[field];
      if(!arr) continue;
      for(let i=0;i<arr.length;i++){
        const v = arr[i];
        if(typeof v === 'string' && v.startsWith('data:')){
          try{
            const blob = await (await fetch(v)).blob();
            const id = (field==='images'?'img-':'voice-')+uid();
            await mediaPut(id, blob);
            mediaUrlCache.set(id, URL.createObjectURL(blob));
            arr[i] = id;
            didMigrate = true;
          }catch(e){ /* leave that one as-is if conversion fails */ }
        }
      }
    }
  }
  if(didMigrate){ save(); if(ui.route==='journal') renderJournal(); }
}

   DEVICE SCREEN LOCK  (WebAuthn — triggers the phone's real
   Face ID / fingerprint / device PIN prompt, not a copy of it)
   ========================================================= */
let DEVICE_UNLOCK_SUPPORTED = false;
function bufToBase64(buf){
  const bytes = new Uint8Array(buf);
  let bin = "";
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function base64ToBuf(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
async function checkDeviceUnlockSupport(){
  try{
    DEVICE_UNLOCK_SUPPORTED = !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
  }catch(e){ DEVICE_UNLOCK_SUPPORTED = false; }
  if(DEVICE_UNLOCK_SUPPORTED && ui.route==="settings") renderSettings();
}
async function setupDeviceUnlock(){
  try{
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rp: { name: "My Day Buddy" },
        user: { id: crypto.getRandomValues(new Uint8Array(16)), name: "daybuddy-journal", displayName: "My Day Buddy Journal" },
        pubKeyCredParams: [{type:"public-key", alg:-7},{type:"public-key", alg:-257}],
        authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
        timeout: 60000,
        attestation: "none"
      }
    });
    state.settings.journalWebAuthnCredId = bufToBase64(cred.rawId);
    state.settings.journalUnlockMethod = "device";
    state.settings.journalLockEnabled = true;
    ui.journalUnlocked = true;
    save();
    return true;
  }catch(e){
    return false;
  }
}
async function verifyDeviceUnlock(){
  try{
    await navigator.credentials.get({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        allowCredentials: [{ id: base64ToBuf(state.settings.journalWebAuthnCredId), type: "public-key" }],
        userVerification: "required",
        timeout: 60000,
      }
    });
    return true;
  }catch(e){
    return false;
  }
}

async function sha256Hex(str){
  // Prefer real SHA-256 when available, but this only works in secure contexts
  // (https/localhost) — fall back to a simple sync hash everywhere else so the
  // lock still works inside previews, sandboxed frames, or file:// pages.
  try{
    if(window.crypto && window.crypto.subtle && window.isSecureContext){
      const buf = new TextEncoder().encode(str);
      const hashBuf = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(hashBuf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){ /* fall through to simple hash below */ }
  return simplePinHash(str);
}
function simplePinHash(str){
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i=0;i<str.length;i++){
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
  h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
  return (h1>>>0).toString(16) + (h2>>>0).toString(16);
}

let journalMediaRecorder = null, journalRecordingChunks = [];
async function toggleVoiceRecording(dateKey, btn){
  if(journalMediaRecorder && journalMediaRecorder.state==="recording"){
    journalMediaRecorder.stop();
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast("Voice recording isn't supported on this device/browser"); return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    journalRecordingChunks = [];
    journalMediaRecorder = new MediaRecorder(stream);
    journalMediaRecorder.ondataavailable = e=>{ if(e.data.size>0) journalRecordingChunks.push(e.data); };
    journalMediaRecorder.onstop = ()=>{
      const blob = new Blob(journalRecordingChunks, {type: journalMediaRecorder.mimeType || 'audio/webm'});
      const id = "voice-"+uid();
      mediaPut(id, blob).then(()=>{
        mediaUrlCache.set(id, URL.createObjectURL(blob));
        const entry = state.journal.entries[dateKey] = state.journal.entries[dateKey] || {text:"", images:[], voiceNotes:[]};
        entry.voiceNotes = entry.voiceNotes || [];
        entry.voiceNotes.push(id);
        save(); rerenderCurrent();
        toast("Voice note saved","mic");
      }).catch(()=> toast("Couldn't save the voice note — device storage may be unavailable"));
      stream.getTracks().forEach(t=>t.stop());
      journalMediaRecorder = null;
    };
    journalMediaRecorder.start();
    if(btn) btn.innerHTML = icon("square",15)+" Stop Recording";
    toast("Recording — tap again to stop","mic");
  }catch(e){
    toast("Microphone access unavailable or was denied");
  }
}

/* =========================================================
   JOURNAL BOOK — export & share
   Builds a single self-contained .html file: text, photos and
   playable voice notes all embedded as data URIs, styled like
   a printed book. Opens anywhere, works offline forever, and
   prints straight to PDF from inside the file.
   ========================================================= */
const BOOK_RANGES = [
  {id:"all", label:"Everything"},
  {id:"365", label:"Past year"},
  {id:"90", label:"Past 90 days"},
  {id:"30", label:"Past 30 days"},
];

function journalEntriesInRange(rangeId){
  const all = Object.keys(state.journal.entries||{}).filter(d=>{
    const e = state.journal.entries[d] || {};
    return (e.text||"").trim().length>0 || (e.images||[]).length>0 || (e.voiceNotes||[]).length>0;
  });
  let keys = all;
  if(rangeId!=="all"){
    const from = addDays(todayKey(), -parseInt(rangeId,10));
    keys = all.filter(d=> d>=from);
  }
  return keys.sort();
}
function bookStats(keys){
  let words=0, photos=0, voices=0;
  keys.forEach(d=>{
    const e = state.journal.entries[d]||{};
    words += (e.text||"").trim().split(/\s+/).filter(Boolean).length;
    photos += (e.images||[]).length;
    voices += (e.voiceNotes||[]).length;
  });
  return {entries:keys.length, words, photos, voices};
}
function blobToDataUrl(blob){
  return new Promise((resolve)=>{
    const fr = new FileReader();
    fr.onload = ()=>resolve(fr.result);
    fr.onerror = ()=>resolve(null);
    fr.readAsDataURL(blob);
  });
}
/* Shrink photos before embedding, otherwise a year of pictures
   makes a file nobody can email. */
async function imageToDataUrl(blob, maxDim){
  maxDim = maxDim || 1400;
  try{
    const bmp = await createImageBitmap(blob);
    let {width:w, height:h} = bmp;
    const scale = Math.min(1, maxDim/Math.max(w,h));
    w = Math.round(w*scale); h = Math.round(h*scale);
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(bmp, 0, 0, w, h);
    bmp.close && bmp.close();
    return canvas.toDataURL("image/jpeg", 0.82);
  }catch(e){
    return await blobToDataUrl(blob);
  }
}
function esc(s){ return escapeHtml(s==null?"":s); }
function bookDateParts(key){
  const [y,m,d] = key.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  return {weekday: dt.toLocaleDateString(undefined,{weekday:"long"}), day:d, month:MONTHS[m-1], year:y};
}

async function buildJournalBook(opts, onProgress){
  const keys = journalEntriesInRange(opts.range);
  const stats = bookStats(keys);
  const total = (opts.photos?stats.photos:0) + (opts.voices?stats.voices:0);
  let done = 0;
  const tick = ()=>{ done++; if(onProgress) onProgress(done, total); };

  const chapters = [];
  for(const key of keys){
    const e = state.journal.entries[key] || {};
    const parts = bookDateParts(key);
    const moodV = (state.mood.logs[key]||{}).value;
    const mood = MOODS.find(m=>m.v===moodV);
    const refl = opts.reflections ? (state.reflections[key]||{}) : {};

    let imgs = [];
    if(opts.photos){
      for(const id of (e.images||[])){
        const blob = await mediaGet(id);
        if(blob){ const url = await imageToDataUrl(blob); if(url) imgs.push(url); }
        tick();
      }
    }
    let auds = [];
    if(opts.voices){
      for(const id of (e.voiceNotes||[])){
        const blob = await mediaGet(id);
        if(blob){ const url = await blobToDataUrl(blob); if(url) auds.push({url, type:blob.type||"audio/webm"}); }
        tick();
      }
    }

    const reflBits = ["wentWell","improve","grateful","feel","tomorrow"]
      .map(k=>({k, v:(refl[k]||"").trim()}))
      .filter(x=>x.v);
    const reflLabels = {wentWell:"What went well", improve:"What could be better", grateful:"Grateful for", feel:"How I felt", tomorrow:"Tomorrow"};

    chapters.push(`
  <article class="entry">
    <header class="entry-head">
      <div class="entry-date"><span class="dnum">${parts.day}</span><span class="drest">${esc(parts.month)} ${parts.year}</span></div>
      <div class="entry-meta"><span class="wd">${esc(parts.weekday)}</span>${mood?`<span class="mood">${mood.emoji} ${esc(mood.label)}</span>`:""}</div>
    </header>
    ${(e.text||"").trim()? `<div class="entry-body">${esc(e.text).replace(/\n{2,}/g,"</p><p>").replace(/\n/g,"<br/>").replace(/^/,"<p>")+"</p>"}</div>` : `<div class="entry-body muted-i">No written entry for this day.</div>`}
    ${imgs.length? `<div class="plates ${imgs.length===1?"one":""}">${imgs.map(u=>`<figure><img src="${u}" alt=""/></figure>`).join("")}</div>`:""}
    ${auds.length? `<div class="voices"><div class="vlabel">Voice ${auds.length>1?"notes":"note"}</div>${auds.map(a=>`<audio controls preload="none" src="${a.url}"></audio>`).join("")}</div>`:""}
    ${reflBits.length? `<div class="reflect"><div class="rlabel">Reflection</div>${reflBits.map(x=>`<div class="rrow"><span class="rk">${esc(reflLabels[x.k])}</span><span class="rv">${esc(x.v)}</span></div>`).join("")}</div>`:""}
  </article>`);
  }

  const first = keys[0], last = keys[keys.length-1];
  const spanLabel = keys.length
    ? (first===last ? fmtDateLong(first) : fmtDateLong(first)+" — "+fmtDateLong(last))
    : "No entries yet";
  const author = state.user.name || "Me";
  const title = author + "'s My Day Buddy";

  const byMonth = {};
  keys.forEach(k=>{ const p=bookDateParts(k); const key=p.month+" "+p.year; byMonth[key]=(byMonth[key]||0)+1; });
  const contents = Object.keys(byMonth).map(m=>`<li><span>${esc(m)}</span><span class="dots"></span><span>${byMonth[m]} ${byMonth[m]===1?"entry":"entries"}</span></li>`).join("");

  return `<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>${esc(title)}</title>
<style>
  :root{ --paper:#FBF8F1; --ink:#23262B; --soft:#6B6F76; --faint:#A8A296; --rule:#E3DCCC; --accent:${state.user.accent||"#4F7A68"}; }
  *{box-sizing:border-box;}
  body{margin:0; background:#EDE8DD; color:var(--ink);
    font-family:Georgia,'Iowan Old Style','Times New Roman',serif; line-height:1.7;
    -webkit-font-smoothing:antialiased;}
  .bar{position:sticky; top:0; z-index:9; display:flex; gap:10px; align-items:center; justify-content:space-between;
    padding:10px 16px; background:rgba(35,38,43,.94); color:#fff; font-family:system-ui,sans-serif; font-size:13px;}
  .bar button{font:inherit; font-weight:600; border:none; border-radius:8px; padding:8px 16px; cursor:pointer;
    background:#fff; color:#23262B;}
  .sheet{max-width:760px; margin:0 auto; background:var(--paper); padding:0 0 80px;
    box-shadow:0 0 60px rgba(0,0,0,.10); min-height:100vh;}
  .cover{padding:110px 64px 80px; text-align:center; border-bottom:1px solid var(--rule);}
  .cover .mark{width:44px;height:44px;border-radius:12px;background:var(--accent); margin:0 auto 26px;}
  .cover h1{font-size:44px; margin:0 0 10px; font-weight:600; letter-spacing:-.02em;}
  .cover .span{color:var(--soft); font-size:15px; font-style:italic; margin-bottom:34px;}
  .figures{display:flex; justify-content:center; gap:34px; flex-wrap:wrap;
    font-family:system-ui,sans-serif; border-top:1px solid var(--rule); padding-top:26px;}
  .figures div{min-width:70px;}
  .figures b{display:block; font-size:23px; font-weight:600; font-family:Georgia,serif;}
  .figures span{font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--faint);}
  .toc{padding:48px 64px; border-bottom:1px solid var(--rule);}
  .toc h2, .entry-body{font-size:16.5px;}

    font-family:system-ui,sans-serif; margin:0 0 18px;}

  .rk{flex:0 0 132px; color:var(--faint); font-family:system-ui,sans-serif; font-size:11.5px;
    text-transform:uppercase; letter-spacing:.06em; padding-top:3px;}
  .rv{flex:1;}

    font-family:system-ui,sans-serif; font-size:11.5px; line-height:1.8;}

    .rrow{flex-direction:column; gap:2px;} .rk{flex:none;}
  }
  @media print{

    .sheet{box-shadow:none; max-width:none; background:transparent; padding-bottom:0;}

    .toc{page-break-after:always; padding:0; border-bottom:none;}
    .entry{page-break-inside:avoid; border-bottom:none; padding:0 0 34px;}

</style>
</head><body>
<div class="bar">
  <span>${esc(title)} · ${stats.entries} ${stats.entries===1?"entry":"entries"}</span>

function openJournalBookModal(){
  const defaults = {range:"all", photos:true, voices:true, reflections:true};
  const preview = ()=>{
    const r = document.querySelector("[data-bk-range].active");
    const rid = r? r.dataset.bkRange : "all";
    const keys = journalEntriesInRange(rid);
    const s = bookStats(keys);
    const el = document.getElementById("bk-summary");
    if(el) el.textContent = s.entries
      ? `${s.entries} ${s.entries===1?"entry":"entries"} · ${s.words.toLocaleString()} words · ${s.photos} photo${s.photos===1?"":"s"} · ${s.voices} voice note${s.voices===1?"":"s"}`
      : "No entries in this period.";
  };
  openModal(`
    <div class="modal-head"><h3>Make a journal book</h3><button class="icon-btn-plain" onclick="__closeModal()">${icon("x",20)}</button></div>
    <p class="muted" style="font-size:12.5px; margin-top:-8px; margin-bottom:16px;">
      One file with your writing, photos and voice notes inside it. Open it in any browser, share it like any file, or print it to PDF.
    </p>
    <div class="field"><label class="field-label">Include</label>
      <div class="chip-row">${BOOK_RANGES.map(r=>`<button class="chip ${r.id===defaults.range?'on active':''}" data-bk-range="${r.id}">${r.label}</button>`).join("")}</div>
      <div class="muted mono" id="bk-summary" style="font-size:11.5px; margin-top:10px;"></div>
    </div>
    <div class="linkline"><span style="font-size:13.5px;">Photos</span><label class="switch"><input type="checkbox" id="bk-photos" checked/><span class="slider"></span></label></div>
    <div class="linkline"><span style="font-size:13.5px;">Voice notes</span><label class="switch"><input type="checkbox" id="bk-voices" checked/><span class="slider"></span></label></div>
    <div class="linkline"><span style="font-size:13.5px;">Daily reflections &amp; mood</span><label class="switch"><input type="checkbox" id="bk-refl" checked/><span class="slider"></span></label></div>
    <p class="muted" style="font-size:11.5px; margin:12px 0 0;">Photos are resized on the way in so the file stays small enough to send. Leaving voice notes out makes it much smaller again.</p>
    <div id="bk-progress" class="muted mono" style="font-size:12px; margin-top:14px; display:none;"></div>
    <button class="btn btn-primary" id="bk-make" style="width:100%; margin-top:16px;">${icon("book-open",15)} Create book</button>
  `);
  document.getElementById("modal-root").querySelectorAll("[data-bk-range]").forEach(b=> b.onclick = ()=>{
    document.querySelectorAll("[data-bk-range]").forEach(x=>x.classList.remove("on","active"));
    b.classList.add("on","active"); preview();
  });
  preview();

  document.getElementById("bk-make").onclick = async ()=>{
    const btn = document.getElementById("bk-make");
    const prog = document.getElementById("bk-progress");
    const opts = {
      range: (document.querySelector("[data-bk-range].active")||{dataset:{bkRange:"all"}}).dataset.bkRange,
      photos: document.getElementById("bk-photos").checked,
      voices: document.getElementById("bk-voices").checked,
      reflections: document.getElementById("bk-refl").checked,
    };
    if(!journalEntriesInRange(opts.range).length){ toast("Nothing to put in the book yet"); return; }
    btn.disabled = true; btn.textContent = "Building...";
    prog.style.display = "block"; prog.textContent = "Gathering entries...";
    try{
      const html = await buildJournalBook(opts, (d,t)=>{ prog.textContent = t? `Embedding media ${d} of ${t}...` : "Laying out pages..."; });
      const blob = new Blob([html], {type:"text/html"});
      const name = "daybuddy-journal-"+todayKey()+".html";
      prog.textContent = "Ready — "+fmtBytes(blob.size);
      const file = (window.File)? new File([blob], name, {type:"text/html"}) : null;
      const canShare = file && navigator.canShare && navigator.canShare({files:[file]});
      btn.disabled = false;
      btn.innerHTML = `${icon("download",15)} Save book (${fmtBytes(blob.size)})`;
      mountIcons();
      btn.onclick = ()=>{
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url), 4000);
        toast("Journal book saved","book-open");
      };
      if(canShare){
        const share = document.createElement("button");
        share.className = "btn btn-ghost";
        share.style.cssText = "width:100%; margin-top:10px;";
        share.innerHTML = `${icon("share-2",15)} Share book`;
        share.onclick = ()=>{ navigator.share({files:[file], title:"My Day Buddy journal"}).catch(()=>{}); };
        btn.parentNode.insertBefore(share, btn.nextSibling);
        mountIcons();
      }
    }catch(e){
      console.warn(e);
      prog.textContent = "";
      btn.disabled = false; btn.innerHTML = `${icon("book-open",15)} Try again`;
      mountIcons();
      toast("Couldn't build the book");
    }
  };
}

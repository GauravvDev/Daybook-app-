<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Daybook — Track your day. Understand yourself.</title>
<meta name="description" content="A calm personal command center for tasks, habits, health and reflection." />
<meta name="theme-color" content="#4F7A68" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
:root{
  --bg:#F5F3EE; --bg-soft:#ECE7DC; --card:#FFFFFF; --card-2:#FBFAF7;
  --ink:#23262B; --ink-soft:#6B6F76; --ink-faint:#9A9EA3;
  --border:#E5E0D3; --accent:#4F7A68; --accent-ink:#ffffff;
  --accent-soft:#E3EEE7; --clay:#D98E73; --clay-soft:#F7E7DE;
  --danger:#C1543C; --danger-soft:#F8E3DD; --gold:#C99A3E;
  --radius-lg:22px; --radius-md:16px; --radius-sm:10px;
  --shadow: 0 1px 2px rgba(35,38,43,.04), 0 8px 24px -12px rgba(35,38,43,.12);
  --shadow-lift: 0 2px 6px rgba(35,38,43,.06), 0 16px 40px -16px rgba(35,38,43,.22);
  color-scheme: light;
}
[data-theme="dark"]{
  --bg:#15171A; --bg-soft:#1B1E22; --card:#1E2126; --card-2:#20242A;
  --ink:#ECEDEE; --ink-soft:#9BA1A8; --ink-faint:#6B7078;
  --border:#2B2F35; --accent:#6EA88F; --accent-ink:#0F1512;
  --accent-soft:rgba(110,168,143,.16); --clay:#E2A183; --clay-soft:rgba(226,161,131,.14);
  --danger:#E17A63; --danger-soft:rgba(225,122,99,.14); --gold:#D9B15C;
  --shadow: 0 1px 2px rgba(0,0,0,.2), 0 8px 24px -12px rgba(0,0,0,.5);
  --shadow-lift: 0 2px 6px rgba(0,0,0,.3), 0 20px 48px -18px rgba(0,0,0,.6);
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  transition:background .25s ease,color .25s ease;
}
h1,h2,h3,.display{font-family:'Fraunces',serif; font-weight:600; letter-spacing:-.01em;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

/* ---------- shell ---------- */
#shell{display:flex; min-height:100vh;}
#sidebar{
  width:236px; flex-shrink:0; background:var(--bg-soft); border-right:1px solid var(--border);
  padding:24px 16px; display:flex; flex-direction:column; gap:3px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px; padding:6px 10px 22px;}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(155deg,var(--accent),var(--clay)); display:flex;align-items:center;justify-content:center;color:var(--accent-ink);flex-shrink:0;}
.brand-name{font-family:'Fraunces',serif; font-weight:600; font-size:19px;}
.nav-item{
  display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px; cursor:pointer;
  color:var(--ink-soft); font-size:14.5px; font-weight:500; border:none; background:transparent; width:100%; text-align:left;
  transition:background .15s ease, color .15s ease;
}
.nav-item:hover{background:var(--card);}
.nav-item.active{background:var(--accent-soft); color:var(--accent); font-weight:600;}
.nav-item svg{width:19px;height:19px; flex-shrink:0;}
.sidebar-foot{margin-top:auto; padding:10px; display:flex; align-items:center; gap:10px; border-top:1px solid var(--border); padding-top:16px;}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Fraunces',serif;flex-shrink:0;}

#main{flex:1; min-width:0; display:flex; flex-direction:column;}
#topbar{display:none;}
#view-root{padding:28px 34px 100px; max-width:1180px; width:100%; margin:0 auto;}

/* ---------- cards / generic ---------- */
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px; box-shadow:var(--shadow);}
.card-tight{padding:16px;}
.grid{display:grid; gap:16px;}
.section-title{display:flex; align-items:center; justify-content:space-between; margin:28px 0 12px;}
.section-title h2{font-size:19px; margin:0;}
.muted{color:var(--ink-soft);}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);}
.btn{
  display:inline-flex; align-items:center; gap:7px; justify-content:center;
  padding:10px 16px; border-radius:12px; border:1px solid transparent; cursor:pointer; font-weight:600; font-size:14px;
  transition:transform .12s ease, box-shadow .12s ease, background .15s ease, opacity .15s;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent); color:var(--accent-ink);}
.btn-primary:hover{box-shadow:var(--shadow-lift);}
.btn-ghost{background:transparent; color:var(--ink); border-color:var(--border);}
.btn-ghost:hover{background:var(--bg-soft);}
.btn-soft{background:var(--accent-soft); color:var(--accent);}
.btn-danger{background:var(--danger-soft); color:var(--danger);}
.btn-icon{width:36px;height:36px;padding:0;border-radius:10px;background:transparent;color:var(--ink-soft);border:1px solid var(--border);}
.btn-icon:hover{background:var(--bg-soft); color:var(--ink);}
.btn[disabled]{opacity:.5; cursor:not-allowed;}
.icon-btn-plain{background:none;border:none;cursor:pointer;color:var(--ink-soft);padding:6px;border-radius:8px;display:flex;}
.icon-btn-plain:hover{background:var(--bg-soft); color:var(--ink);}
input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{
  width:100%; padding:10px 12px; border-radius:11px; border:1px solid var(--border); background:var(--card-2); color:var(--ink);
  font-family:inherit; font-size:14px;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent);}
textarea{resize:vertical; min-height:64px;}
label.field-label{font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; display:block;}
.field{margin-bottom:14px;}
.row{display:flex; gap:10px;}
.row > *{flex:1;}
hr.hair{border:none;border-top:1px solid var(--border); margin:14px 0;}

/* progress ring */
.ring-wrap{position:relative; width:132px; height:132px; flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none; stroke:var(--border); stroke-width:10;}
.ring-fg{fill:none; stroke:var(--accent); stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1);}
.ring-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.ring-center .big{font-family:'Fraunces',serif; font-size:26px; font-weight:600;}
.ring-center .small{font-size:11px; color:var(--ink-soft);}

.bar{height:9px; border-radius:99px; background:var(--bg-soft); overflow:hidden;}
.bar > span{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .5s ease;}

/* hero / greeting */
.hero{display:flex; justify-content:space-between; align-items:flex-start; gap:20px; flex-wrap:wrap;}
.hero h1{font-size:30px; margin:0 0 4px;}
.hero .sub{color:var(--ink-soft); font-size:14.5px;}

.quote-card{background:linear-gradient(155deg,var(--accent-soft),var(--card)); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px 22px; position:relative;}
.quote-card p.qtext{font-family:'Fraunces',serif; font-size:18px; line-height:1.5; margin:0 0 8px; font-style:italic;}
.quote-card .qauthor{font-size:12.5px; color:var(--ink-soft); font-weight:600;}

/* task/habit list items */
.item-row{display:flex; align-items:center; gap:12px; padding:12px 6px; border-bottom:1px solid var(--border);}
.item-row:last-child{border-bottom:none;}
.checkbox{
  width:23px; height:23px; border-radius:8px; border:2px solid var(--border); flex-shrink:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:all .15s ease; background:var(--card-2);
}
.checkbox.done{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.checkbox svg{width:14px;height:14px;}
.item-title{font-weight:600; font-size:14.5px;}
.item-title.done{text-decoration:line-through; color:var(--ink-soft); font-weight:500;}
.item-meta{font-size:12px; color:var(--ink-soft); display:flex; gap:8px; margin-top:2px; flex-wrap:wrap;}
.tag{font-size:11px; font-weight:600; padding:2px 8px; border-radius:99px; background:var(--bg-soft); color:var(--ink-soft);}
.tag.prio-high{background:var(--danger-soft); color:var(--danger);}
.tag.prio-med{background:var(--clay-soft); color:var(--clay);}
.tag.prio-low{background:var(--accent-soft); color:var(--accent);}

.empty-state{text-align:center; padding:36px 12px; color:var(--ink-soft);}
.empty-state svg{width:34px;height:34px; margin-bottom:10px; opacity:.55;}
.empty-state .et-title{font-weight:600; color:var(--ink); font-family:'Fraunces',serif; font-size:16px; margin-bottom:3px;}

/* mood */
.mood-row{display:flex; gap:8px; justify-content:space-between;}
.mood-opt{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 4px; border-radius:14px; cursor:pointer; border:2px solid transparent; background:var(--bg-soft); transition:all .15s;}
.mood-opt.selected{border-color:var(--accent); background:var(--accent-soft);}
.mood-opt .emoji{font-size:22px;}
.mood-opt .lbl{font-size:11px; font-weight:600; color:var(--ink-soft);}

/* modal */
.overlay{position:fixed; inset:0; background:rgba(20,22,25,.45); backdrop-filter:blur(2px); display:flex; align-items:flex-end; justify-content:center; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s ease;}
.overlay.open{opacity:1; pointer-events:auto;}
@media(min-width:720px){.overlay{align-items:center;}}
.modal{background:var(--card); width:100%; max-width:480px; border-radius:22px 22px 0 0; padding:22px; max-height:88vh; overflow-y:auto; transform:translateY(16px); transition:transform .22s cubic-bezier(.2,.8,.3,1); box-shadow:var(--shadow-lift);}
.overlay.open .modal{transform:translateY(0);}
@media(min-width:720px){.modal{border-radius:22px; margin-bottom:0;}}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-head h3{margin:0; font-size:19px;}

/* toasts */
#toast-root{position:fixed; top:18px; right:18px; z-index:200; display:flex; flex-direction:column; gap:8px; max-width:320px;}
@media(max-width:719px){#toast-root{left:12px; right:12px; top:12px; max-width:none;}}
.toast{background:var(--ink); color:var(--bg); padding:12px 16px; border-radius:12px; font-size:13.5px; font-weight:500; box-shadow:var(--shadow-lift); display:flex; align-items:center; gap:10px; animation:toastIn .25s ease;}
[data-theme="dark"] .toast{background:var(--card); color:var(--ink); border:1px solid var(--border);}
@keyframes toastIn{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);}}

/* bottom nav (mobile) */
#bottomnav{display:none;}
@media(max-width:900px){
  #sidebar{display:none;}
  #view-root{padding:18px 16px 90px;}
  #bottomnav{
    display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--border);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom)); z-index:80; justify-content:space-around;
  }
  .bn-item{display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--ink-soft); font-size:10.5px; font-weight:600; padding:4px 8px; border-radius:10px;}
  .bn-item.active{color:var(--accent);}
  .bn-item svg{width:21px;height:21px;}
  #topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; position:sticky; top:0; background:var(--bg); z-index:50; border-bottom:1px solid var(--border);}
}

.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
@media(min-width:760px){ .cols-2{display:grid; grid-template-columns:1.3fr 1fr; gap:18px; align-items:start;} }
@media(max-width:759px){ .grid-2{grid-template-columns:1fr 1fr;} .grid-3{grid-template-columns:1fr 1fr;} }

.streak-flame{display:inline-flex; align-items:center; gap:3px; font-size:12px; font-weight:700; color:var(--clay);}
.chart-bars{display:flex; align-items:flex-end; gap:6px; height:90px;}
.chart-bars .cb{flex:1; background:var(--accent-soft); border-radius:6px 6px 2px 2px; position:relative; min-height:4px;}
.chart-bars .cb > span{position:absolute; inset:0; bottom:0; background:var(--accent); border-radius:6px 6px 2px 2px; transition:height .5s ease;}
.chart-bars .cb-label{font-size:10px; color:var(--ink-soft); text-align:center; margin-top:5px;}
.cb-label-standalone{font-size:10px; color:var(--ink-soft); text-align:center; margin-top:5px; display:block;}

.qty-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--card-2);color:var(--ink);font-size:17px;font-weight:700;cursor:pointer;}
.qty-btn:hover{background:var(--bg-soft);}

.timer-display{font-family:'Fraunces',serif; font-size:56px; text-align:center; font-weight:600; letter-spacing:-.02em; margin:6px 0;}
.segmented{display:flex; background:var(--bg-soft); border-radius:12px; padding:3px; gap:3px;}
.segmented button{flex:1; padding:8px; border:none; background:transparent; border-radius:9px; font-weight:600; font-size:13px; color:var(--ink-soft); cursor:pointer;}
.segmented button.active{background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08);}

.color-dot{width:26px;height:26px;border-radius:50%; cursor:pointer; border:2px solid transparent; flex-shrink:0;}
.color-dot.selected{border-color:var(--ink);}

.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.cal-cell{aspect-ratio:1; border-radius:11px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; font-size:12.5px; font-weight:600; border:1px solid transparent; gap:3px; position:relative; background:var(--card-2);}
.cal-cell:hover{background:var(--bg-soft);}
.cal-cell.today{border-color:var(--accent);}
.cal-cell.selected{background:var(--accent); color:var(--accent-ink);}
.cal-cell.other-month{opacity:.32;}
.cal-dot{width:4px;height:4px;border-radius:50%; background:var(--clay);}
.cal-cell.selected .cal-dot{background:var(--accent-ink);}
.weekday-lbl{text-align:center; font-size:10.5px; color:var(--ink-soft); font-weight:700;}

.switch{position:relative; width:42px; height:24px; flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute; inset:0; background:var(--border); border-radius:99px; cursor:pointer; transition:.2s;}
.slider:before{content:""; position:absolute; width:18px;height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s;}
.switch input:checked + .slider{background:var(--accent);}
.switch input:checked + .slider:before{transform:translateX(18px);}

.linkline{display:flex; align-items:center; justify-content:space-between; padding:13px 4px; border-bottom:1px solid var(--border);}
.linkline:last-child{border-bottom:none;}

.fab{display:none;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:99px;}
.skeleton{background:linear-gradient(90deg,var(--bg-soft) 25%,var(--border) 37%,var(--bg-soft) 63%); background-size:400% 100%; animation:sk 1.4s ease infinite; border-radius:8px;}
@keyframes sk{0%{background-position:100% 50%;}100%{background-position:0 50%;}}
</style>
</head>
<body>
<div id="shell">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark" id="brand-mark-icon"></div>
      <div class="brand-name">Daybook</div>
    </div>
    <nav id="nav-list"></nav>
    <div class="sidebar-foot">
      <div class="avatar" id="side-avatar"></div>
      <div style="min-width:0;">
        <div style="font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" id="side-name"></div>
        <div style="font-size:11.5px; color:var(--ink-soft);" id="side-date"></div>
      </div>
    </div>
  </aside>
  <div id="main">
    <div id="topbar">
      <div style="display:flex;align-items:center;gap:9px;">
        <div class="brand-mark" style="width:28px;height:28px;" id="topbar-mark"></div>
        <span class="brand-name" style="font-size:16px;">Daybook</span>
      </div>
      <button class="btn-icon" id="topbar-theme"></button>
    </div>
    <div id="view-root"></div>
  </div>
</div>
<nav id="bottomnav"></nav>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
/* =========================================================
   DAYBOOK — Daily Life Tracker
   Single-file app. Vanilla JS + localStorage. No build step.
   ========================================================= */
(function(){
"use strict";

/* ---------------- constants ---------------- */
const STORAGE_KEY = "daybook_state_v1";

const QUOTES = [
["The secret of getting ahead is getting started.","Mark Twain"],

["Sleep is the best meditation.","Dalai Lama"],
["Growth is uncomfortable because you've never been here before.","Unknown"],
["What gets measured gets managed.","Peter Drucker"],

const MOODS = [
{v:5, emoji:"😄", label:"Great"},

const NAV_ITEMS = [
  {id:"home", label:"Home", icon:"home"},
  {id:"tasks", label:"Tasks", icon:"check-square"},
  {id:"habits", label:"Habits", icon:"repeat"},
  {id:"goals", label:"Goals", icon:"target"},
  {id:"focus", label:"Focus", icon:"timer"},
  {id:"journal", label:"Journal", icon:"notebook-pen"},
  {id:"health", label:"Health", icon:"heart-pulse"},
  {id:"calendar", label:"Calendar", icon:"calendar-days"},
  {id:"insights", label:"Insights", icon:"bar-chart-3"},
  {id:"settings", label:"Settings", icon:"settings"},
];
const BOTTOM_NAV = ["home","tasks","focus","journal","more"];
const MORE_SHEET_ITEMS = ["habits","goals","health","calendar","insights","settings"];
const GOAL_TYPES = [
  {id:"project", label:"Project", icon:"briefcase"},
  {id:"study", label:"Study / Exam", icon:"graduation-cap"},
  {id:"personal", label:"Personal", icon:"star"},
  {id:"custom", label:"Custom", icon:"target"},
];
const GOAL_STATUSES = [
  {id:"active", label:"On Track", color:"var(--accent)"},
  {id:"delayed", label:"Delayed", color:"var(--danger)"},
  {id:"done", label:"Done", color:"var(--gold)"},

/* ---------------- date helpers ---------------- */
function todayKey(d){ d = d || new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(key, n){ const [y,m,d] = key.split("-").map(Number); const dt = new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return todayKey(dt); }
function fmtDateLong(key){ const [y,m,d]=key.split("-").map(Number); return MONTHS[m-1]+" "+d+", "+y; }
function fmtTime12(hhmm){ if(!hhmm) return ""; let [h,m]=hhmm.split(":").map(Number); const ap = h>=12?"PM":"AM"; h = h%12; if(h===0)h=12; return h+":"+String(m).padStart(2,"0")+" "+ap; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }
function lastNDays(n){ const arr=[]; for(let i=n-1;i>=0;i--) arr.push(addDays(todayKey(),-i)); return arr; }

let state = load();
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    // shallow-merge with defaults for forward-compat
    const def = defaultState();
    // returning users (any existing saved state) shouldn't see the onboarding wizard
    // just because it's a newly added field — only truly fresh installs get it.
    if(parsed.onboarded === undefined) parsed.onboarded = true;
    return Object.assign({}, def, parsed, {
      user:Object.assign({},def.user, parsed.user||{}),
      settings:Object.assign({},def.settings, parsed.settings||{}),
    });
  }catch(e){ console.warn("load failed, resetting", e); return defaultState(); }
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ console.warn("save failed", e); }
  }, 120);
}

/* ---------------- toast ---------------- */
function toast(msg, iconName){
  const root = document.getElementById("toast-root");
  const el = document.createElement("div");
  el.className="toast";
  el.innerHTML = `${iconName? icon(iconName,16):""}<span>${escapeHtml(msg)}</span>`;
  root.appendChild(el);
  mountIcons();
  setTimeout(()=>{ el.style.opacity="0"; el.style.transform="translateY(-6px)"; el.style.transition="all .25s"; setTimeout(()=>el.remove(),250); }, 2600);
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------------- icons (lucide) ---------------- */
function icon(name, size, extraAttrs){
  size = size||18;
  return `<i data-lucide="${name}" style="width:${size}px;height:${size}px;${extraAttrs||''}"></i>`;
}
function mountIcons(){ try{ window.lucide.createIcons(); }catch(e){} }

/* ---------------- confirm modal ---------------- */
function confirmAction(title, body, onYes){
  openModal(`

    <p class="muted" style="font-size:14px; line-height:1.5;">${escapeHtml(body)}</p>

      <button class="btn btn-ghost" onclick="__closeModal()">Cancel</button>
      <button class="btn btn-danger" id="confirm-yes-btn">Confirm</button>
    </div>
  `);
  document.getElementById("confirm-yes-btn").onclick = ()=>{ closeModal(); onYes(); };
}
function openModal(innerHtml){
  const root = document.getElementById("modal-root");
  root.innerHTML = `<div class="overlay" id="ov"><div class="modal">${innerHtml}</div></div>`;
  const ov = document.getElementById("ov");
  ov.addEventListener("click", (e)=>{ if(e.target.id==="ov") closeModal(); });
  requestAnimationFrame(()=>ov.classList.add("open"));
  mountIcons();
}
function closeModal(){
  const ov = document.getElementById("ov");
  if(!ov) return;
  ov.classList.remove("open");
  setTimeout(()=>{ document.getElementById("modal-root").innerHTML=""; }, 200);
}
window.__closeModal = closeModal;

   ========================================================= */
function greeting(){
  const h = new Date().getHours();
  if(h<12) return "Good morning";
  if(h<17) return "Good afternoon";
  return "Good evening";
}
function dayCompletionPct(dateKey){
  dateKey = dateKey || todayKey();
  let total=0, done=0;
  const dayTasks = state.tasks.filter(t=>t.date===dateKey);
  total += dayTasks.length; done += dayTasks.filter(t=>t.completed).length;
  total += state.habits.length; done += state.habits.filter(h=> (state.habitLogs[dateKey]||{})[h.id]).length;
  const waterGoal = state.settings.waterGoalMl; const waterVal = (state.water.logs[dateKey]||0);
  total += 1; if(waterVal>=waterGoal) done+=1; else done += clamp(waterVal/waterGoal,0,1);
  if(total===0) return 0;
  return clamp(Math.round((done/total)*100),0,100);
}
function currentQuote(){
  const dk = todayKey();
  if(state.quoteIndexByDate[dk]===undefined){
    state.quoteIndexByDate[dk] = Math.floor(Math.random()*QUOTES.length); save();
  }
  return QUOTES[state.quoteIndexByDate[dk]];
}
function refreshQuote(){
  const dk = todayKey();
  let idx;
  do{ idx = Math.floor(Math.random()*QUOTES.length); } while(idx===state.quoteIndexByDate[dk] && QUOTES.length>1);
  state.quoteIndexByDate[dk]=idx; save(); renderHome();
}
function toggleFavQuote(){
  const [q] = currentQuote();
  const i = state.favoriteQuotes.indexOf(q);
  if(i>=0) state.favoriteQuotes.splice(i,1); else state.favoriteQuotes.push(q);
  save(); renderHome();
}

function ringSvg(pct, size, strokeW){
  size = size||132; strokeW = strokeW||10;
  const r = (size-strokeW)/2; const c = 2*Math.PI*r; const off = c - (pct/100)*c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${strokeW}"></circle>
    <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${strokeW}" stroke-dasharray="${c}" stroke-dashoffset="${off}"></circle>
  </svg>`;
}

  const root = document.getElementById("view-root");

/* ---------------- dashboard customization ---------------- */
const DASHBOARD_SECTIONS = [
  {id:"quote", label:"Daily Quote", icon:"quote", zone:"top"},
  {id:"tasks", label:"Today's Tasks", icon:"check-square", zone:"left"},
  {id:"habits", label:"Habits", icon:"repeat", zone:"left"},
  {id:"goals", label:"Goals", icon:"target", zone:"left"},
  {id:"water", label:"Water Tracker", icon:"droplets", zone:"right"},
  {id:"mood", label:"Mood Check-in", icon:"smile", zone:"right"},
  {id:"focus", label:"Focus Timer", icon:"timer", zone:"right"},
];
function defaultDashboardLayout(){ return DASHBOARD_SECTIONS.map(s=>({id:s.id, enabled:true})); }
function getDashboardLayout(){
  if(!state.dashboardLayout || !Array.isArray(state.dashboardLayout) || state.dashboardLayout.length===0){
    state.dashboardLayout = defaultDashboardLayout();
  }
  // forward-compat: add any new known sections that aren't present yet
  DASHBOARD_SECTIONS.forEach(s=>{
    if(!state.dashboardLayout.some(l=>l.id===s.id)) state.dashboardLayout.push({id:s.id, enabled:true});
  });
  return state.dashboardLayout;
}
function openDashboardCustomizeModal(){

      <button class="btn btn-primary" id="dash-cust-done" style="flex:2;">Done</button>
    </div>
  `);
  renderDashCustList();
  document.getElementById("dash-cust-reset").onclick = ()=>{
    state.dashboardLayout = defaultDashboardLayout(); save(); renderDashCustList(); rerenderCurrent();
  };
  document.getElementById("dash-cust-done").onclick = closeModal;

function renderDashCustList(){

    const meta = DASHBOARD_SECTIONS.find(s=>s.id===item.id) || {label:item.id, icon:"circle"};
    return `<div class="linkline" data-row="${item.id}">
      <span style="display:flex; align-items:center; gap:10px; font-weight:600; font-size:13.5px; ${item.enabled?'':'color:var(--ink-faint);'}">${icon(meta.icon,16)} ${meta.label}</span>
      <span style="display:flex; align-items:center; gap:4px;">
        <button class="icon-btn-plain" data-move="up" data-id="${item.id}" ${i===0?'disabled style="opacity:.3;"':''}>${icon("chevron-up",16)}</button>
        <button class="icon-btn-plain" data-move="down" data-id="${item.id}" ${i===layout.length-1?'disabled style="opacity:.3;"':''}>${icon("chevron-down",16)}</button>
        <label class="switch" style="margin-left:6px;"><input type="checkbox" data-toggle-section="${item.id}" ${item.enabled?'checked':''}/><span class="slider"></span></label>
      </span>
    </div>`;
  }).join("");
  listEl.querySelectorAll("[data-toggle-section]").forEach(el=> el.onchange = ()=>{
    const it = layout.find(l=>l.id===el.dataset.toggleSection);
    it.enabled = el.checked; save(); renderDashCustList(); rerenderCurrent();
  });
  listEl.querySelectorAll("[data-move]").forEach(el=> el.onclick = ()=>{
    if(el.disabled) return;
    const idx = layout.findIndex(l=>l.id===el.dataset.id);
    const dir = el.dataset.move==="up"?-1:1;
    const swapIdx = idx+dir;
    if(swapIdx<0 || swapIdx>=layout.length) return;
    [layout[idx], layout[swapIdx]] = [layout[swapIdx], layout[idx]];
    save(); renderDashCustList(); rerenderCurrent();
  });
  mountIcons();
}
function emptyState(iconName,title,body){
  return `<div class="empty-state">${icon(iconName,30)}<div class="et-title">${escapeHtml(title)}</div><div>${escapeHtml(body)}</div></div>`;
}

/* ---------- habit chip (home) ---------- */
function habitChipHtml(h, dateKey){
  const done = !!(state.habitLogs[dateKey]||{})[h.id];
  const streak = habitStreak(h.id, dateKey);
  return `<div style="text-align:center;">
    <button class="checkbox ${done?'done':''}" style="width:52px;height:52px;border-radius:16px;margin:0 auto 6px;" data-habit-toggle="${h.id}">
      ${icon(h.icon||"circle", 22)}
    </button>
    <div style="font-size:11.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(h.name)}</div>
    ${streak>0?`<div class="streak-flame">${icon("flame",11)} ${streak}</div>`:""}
  </div>`;
}
function bindHabitChipEvents(root, dateKey){
  root.querySelectorAll("[data-habit-toggle]").forEach(el=> el.onclick = ()=>{
    const id = el.dataset.habitToggle;
    state.habitLogs[dateKey] = state.habitLogs[dateKey] || {};
    const now = !state.habitLogs[dateKey][id];
    state.habitLogs[dateKey][id] = now;
    save(); rerenderCurrent();
    if(now) toast("Habit checked off","flame");
  });
}
function habitStreak(habitId, fromDateKey){
  let streak=0, d = fromDateKey;
  while(true){
    const log = state.habitLogs[d];
    if(log && log[habitId]){ streak++; d = addDays(d,-1); } else break;
  }
  return streak;
}

   POMODORO
   ========================================================= */
function pomodoroWidgetHtml(){
  const mm = String(Math.floor(ui.pomodoro.remaining/60)).padStart(2,"0");
  const ss = String(ui.pomodoro.remaining%60).padStart(2,"0");
  const linked = ui.pomodoro.activeSessionId ? state.focusSessions.find(s=>s.id===ui.pomodoro.activeSessionId) : null;
  return `
    <div class="segmented" style="margin-bottom:10px;">
      <button data-pmode="focus" class="${ui.pomodoro.mode==='focus'?'active':''}">Focus</button>
      <button data-pmode="break" class="${ui.pomodoro.mode==='break'?'active':''}">Break</button>
    </div>
    <div class="timer-display mono" id="pomo-display">${mm}:${ss}</div>
    ${linked?`<div class="pill" style="display:flex; justify-content:center; margin:0 auto 10px; width:fit-content;">${icon("link",11)} ${escapeHtml(linked.label)}</div>`:""}
    <div class="row">
      <button class="btn btn-primary" id="pomo-startpause">${icon(ui.pomodoro.running?"pause":"play",15)} ${ui.pomodoro.running?"Pause":"Start"}</button>
      <button class="btn-icon" id="pomo-reset">${icon("rotate-ccw",16)}</button>
    </div>
    <div class="muted" style="font-size:11.5px; margin-top:8px; text-align:center;">Today's focus time: <span class="mono">${todayFocusMinutes()}m</span></div>
  `;
}
function todayFocusMinutes(){
  const s = state.pomodoro.sessions[todayKey()] || 0; return s;
}
function mountPomodoroWidget(){
  const root = document.getElementById("view-root");
  const modeBtns = root.querySelectorAll("[data-pmode]");
  modeBtns.forEach(b=> b.onclick = ()=>{
    pomoStop();
    ui.pomodoro.activeSessionId = null;
    ui.pomodoro.mode = b.dataset.pmode;
    ui.pomodoro.remaining = (ui.pomodoro.mode==="focus"?state.settings.pomodoroFocusMin:state.settings.pomodoroBreakMin)*60;
    refreshFullPomo();
  });
  const sp = root.querySelector("#pomo-startpause");
  if(sp) sp.onclick = ()=> ui.pomodoro.running ? pomoStop() : pomoStart();
  const rs = root.querySelector("#pomo-reset");
  if(rs) rs.onclick = ()=>{ pomoStop(); ui.pomodoro.activeSessionId=null; ui.pomodoro.remaining = (ui.pomodoro.mode==="focus"?state.settings.pomodoroFocusMin:state.settings.pomodoroBreakMin)*60; refreshFullPomo(); };
}
function pomoStart(){
  ui.pomodoro.running = true;
  ui.pomodoro.interval = setInterval(()=>{
    ui.pomodoro.remaining--;
    if(ui.pomodoro.remaining<=0){
      pomoStop();
      if(ui.pomodoro.mode==="focus"){
        const dk = todayKey();
        const minutesRun = Math.round((ui.pomodoro.mode==="focus"?state.settings.pomodoroFocusMin:0));
        state.pomodoro.sessions[dk] = (state.pomodoro.sessions[dk]||0) + minutesRun;
        if(ui.pomodoro.activeSessionId){
          const sess = state.focusSessions.find(s=>s.id===ui.pomodoro.activeSessionId);
          if(sess) sess.completed = true;
          ui.pomodoro.activeSessionId = null;
        }
        save();
        notify("Focus session complete","Nice work — time for a break.");
      } else {
        notify("Break's over","Ready for another focus session?");
      }
      ui.pomodoro.remaining = (ui.pomodoro.mode==="focus"?state.settings.pomodoroBreakMin:state.settings.pomodoroFocusMin)*60;
      ui.pomodoro.mode = ui.pomodoro.mode==="focus"?"break":"focus";
      refreshFullPomo();
      return;
    }
    refreshPomoDisplay();
  }, 1000);
  refreshFullPomo();
}
function pomoStop(){ ui.pomodoro.running=false; clearInterval(ui.pomodoro.interval); refreshFullPomo(); }
function refreshPomoDisplay(){
  const el = document.getElementById("pomo-display"); if(!el) return;
  const mm = String(Math.floor(ui.pomodoro.remaining/60)).padStart(2,"0");
  const ss = String(ui.pomodoro.remaining%60).padStart(2,"0");
  el.textContent = mm+":"+ss;
}
function refreshFullPomo(){
  if(ui.route==="home" || ui.route==="health" || ui.route==="focus"){ render(); }
}

  }
  return clamp(g.progress||0, 0, 100);
}
function goalTypeMeta(id){ return GOAL_TYPES.find(t=>t.id===id) || GOAL_TYPES[GOAL_TYPES.length-1]; }
function goalStatusMeta(id){ return GOAL_STATUSES.find(s=>s.id===id) || GOAL_STATUSES[0]; }

/* =========================================================
   DEVICE STORAGE  (IndexedDB for photos/voice notes — localStorage
   only holds ~5-10MB, media needs real device-scale storage)
   ========================================================= */
const MEDIA_DB_NAME = "daybook_media";
const MEDIA_STORE = "blobs";
let mediaDbPromise = null;
function openMediaDb(){
  if(mediaDbPromise) return mediaDbPromise;
  mediaDbPromise = new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error("IndexedDB not supported")); return; }
    const req = indexedDB.open(MEDIA_DB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(MEDIA_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return mediaDbPromise;
}
async function mediaPut(id, blob){
  const db = await openMediaDb();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(MEDIA_STORE, "readwrite");
    tx.objectStore(MEDIA_STORE).put(blob, id);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function mediaGet(id){
  const db = await openMediaDb();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(MEDIA_STORE, "readonly");
    const req = tx.objectStore(MEDIA_STORE).get(id);
    req.onsuccess = ()=>resolve(req.result || null);
    req.onerror = ()=>reject(req.error);
  });
}
async function mediaDelete(id){
  const db = await openMediaDb();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(MEDIA_STORE, "readwrite");
    tx.objectStore(MEDIA_STORE).delete(id);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
const mediaUrlCache = new Map(); // mediaId -> blob object URL, populated lazily
function mediaUrl(id){ return mediaUrlCache.get(id) || ""; }
async function ensureMediaUrls(ids){
  let changed = false;
  for(const id of ids){
    if(!id || mediaUrlCache.has(id)) continue;
    try{
      const blob = await mediaGet(id);
      if(blob){ mediaUrlCache.set(id, URL.createObjectURL(blob)); changed = true; }
    }catch(e){ /* skip individual failures, rest still render */ }
  }
  return changed;
}
// One-time migration: earlier versions stored photos/voice notes as giant
// base64 strings directly in localStorage. Move any of those into IndexedDB
// so old data keeps working under the new, much larger storage limit.
async function migrateBase64MediaToIndexedDB(){
  let didMigrate = false;
  for(const dateKey of Object.keys(state.journal.entries)){
    const entry = state.journal.entries[dateKey];
    for(const field of ['images','voiceNotes']){
      const arr = entry[field];
      if(!arr) continue;
      for(let i=0;i<arr.length;i++){
        const v = arr[i];
        if(typeof v === 'string' && v.startsWith('data:')){
          try{
            const blob = await (await fetch(v)).blob();
            const id = (field==='images'?'img-':'voice-')+uid();
            await mediaPut(id, blob);
            mediaUrlCache.set(id, URL.createObjectURL(blob));
            arr[i] = id;
            didMigrate = true;
          }catch(e){ /* leave that one as-is if conversion fails */ }
        }
      }
    }
  }
  if(didMigrate){ save(); if(ui.route==='journal') renderJournal(); }
}

/* =========================================================
   DEVICE SCREEN LOCK  (WebAuthn — triggers the phone's real
   Face ID / fingerprint / device PIN prompt, not a copy of it)
   ========================================================= */
let DEVICE_UNLOCK_SUPPORTED = false;
function bufToBase64(buf){
  const bytes = new Uint8Array(buf);
  let bin = "";
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function base64ToBuf(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
async function checkDeviceUnlockSupport(){
  try{
    DEVICE_UNLOCK_SUPPORTED = !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
  }catch(e){ DEVICE_UNLOCK_SUPPORTED = false; }
  if(DEVICE_UNLOCK_SUPPORTED && ui.route==="settings") renderSettings();
}
async function setupDeviceUnlock(){
  try{
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rp: { name: "Daybook" },
        user: { id: crypto.getRandomValues(new Uint8Array(16)), name: "daybook-journal", displayName: "Daybook Journal" },
        pubKeyCredParams: [{type:"public-key", alg:-7},{type:"public-key", alg:-257}],
        authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
        timeout: 60000,
        attestation: "none"
      }
    });
    state.settings.journalWebAuthnCredId = bufToBase64(cred.rawId);
    state.settings.journalUnlockMethod = "device";
    state.settings.journalLockEnabled = true;
    ui.journalUnlocked = true;
    save();
    return true;
  }catch(e){
    return false;
  }
}
async function verifyDeviceUnlock(){
  try{
    await navigator.credentials.get({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        allowCredentials: [{ id: base64ToBuf(state.settings.journalWebAuthnCredId), type: "public-key" }],
        userVerification: "required",
        timeout: 60000,
      }
    });
    return true;
  }catch(e){
    return false;
  }
}

async function sha256Hex(str){
  // Prefer real SHA-256 when available, but this only works in secure contexts
  // (https/localhost) — fall back to a simple sync hash everywhere else so the
  // lock still works inside previews, sandboxed frames, or file:// pages.
  try{
    if(window.crypto && window.crypto.subtle && window.isSecureContext){
      const buf = new TextEncoder().encode(str);
      const hashBuf = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(hashBuf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){ /* fall through to simple hash below */ }
  return simplePinHash(str);
}
function simplePinHash(str){
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i=0;i<str.length;i++){
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
  h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
  return (h1>>>0).toString(16) + (h2>>>0).toString(16);
}

let journalMediaRecorder = null, journalRecordingChunks = [];
async function toggleVoiceRecording(dateKey, btn){
  if(journalMediaRecorder && journalMediaRecorder.state==="recording"){
    journalMediaRecorder.stop();
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast("Voice recording isn't supported on this device/browser"); return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    journalRecordingChunks = [];
    journalMediaRecorder = new MediaRecorder(stream);
    journalMediaRecorder.ondataavailable = e=>{ if(e.data.size>0) journalRecordingChunks.push(e.data); };
    journalMediaRecorder.onstop = ()=>{
      const blob = new Blob(journalRecordingChunks, {type: journalMediaRecorder.mimeType || 'audio/webm'});
      const id = "voice-"+uid();
      mediaPut(id, blob).then(()=>{
        mediaUrlCache.set(id, URL.createObjectURL(blob));
        const entry = state.journal.entries[dateKey] = state.journal.entries[dateKey] || {text:"", images:[], voiceNotes:[]};
        entry.voiceNotes = entry.voiceNotes || [];
        entry.voiceNotes.push(id);
        save(); rerenderCurrent();
        toast("Voice note saved","mic");
      }).catch(()=> toast("Couldn't save the voice note — device storage may be unavailable"));
      stream.getTracks().forEach(t=>t.stop());
      journalMediaRecorder = null;
    };
    journalMediaRecorder.start();
    if(btn) btn.innerHTML = icon("square",15)+" Stop Recording";
    toast("Recording — tap again to stop","mic");
  }catch(e){
    toast("Microphone access unavailable or was denied");
  }
}

function bindReflectionEvents(root, dateKey){
  const card = root.querySelector("#reflection-card");
  if(!card) return;
  const btn = card.querySelector("#save-reflection");
  btn.onclick = ()=>{
    const obj = state.reflections[dateKey] || {};
    card.querySelectorAll("[data-rf]").forEach(ta=> obj[ta.dataset.rf]=ta.value);
    state.reflections[dateKey]=obj; save(); toast("Reflection saved","book-heart");
  };
}

function renderCalendar(){
  const root = document.getElementById("view-root");
  const cm = ui.calMonth;
  const year = cm.getFullYear(), month = cm.getMonth();
  const firstDow = new Date(year,month,1).getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const daysInPrevMonth = new Date(year,month,0).getDate();
  const cells = [];
  for(let i=firstDow-1;i>=0;i--) cells.push({d:daysInPrevMonth-i, other:true, key:null});
  for(let d=1; d<=daysInMonth; d++){
    const key = year+"-"+String(month+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    cells.push({d, other:false, key});
  }
  while(cells.length%7!==0) cells.push({d:cells.length, other:true, key:null});

  const sel = ui.calSelected;
  root.innerHTML = `
    <div class="hero"><div><h1>Calendar</h1><div class="sub">Look back on any day.</div></div></div>
    <div class="cols-2" style="margin-top:18px;">
      <div class="card">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;">
          <button class="icon-btn-plain" id="cal-prev">${icon("chevron-left",19)}</button>
          <div style="font-family:'Fraunces',serif; font-weight:600; font-size:16px;">${MONTHS[month]} ${year}</div>
          <button class="icon-btn-plain" id="cal-next">${icon("chevron-right",19)}</button>
        </div>
        <div class="cal-grid" style="margin-bottom:6px;">${DAYS.map(d=>`<div class="weekday-lbl">${d}</div>`).join("")}</div>
        <div class="cal-grid">
          ${cells.map(c=>{
            if(c.other) return `<div class="cal-cell other-month">${c.d}</div>`;
            const hasActivity = dayHasActivity(c.key);
            return `<div class="cal-cell ${c.key===todayKey()?'today':''} ${c.key===sel?'selected':''}" data-daykey="${c.key}">
              <span>${c.d}</span>${hasActivity?'<span class="cal-dot"></span>':''}
            </div>`;
          }).join("")}
        </div>
        <button class="btn btn-ghost" id="cal-today" style="width:100%; margin-top:14px;">${icon("calendar",15)} Jump to Today</button>
      </div>
      <div id="cal-detail"></div>
    </div>
  `;
  document.getElementById("cal-prev").onclick = ()=>{ ui.calMonth = new Date(year, month-1, 1); renderCalendar(); };
  document.getElementById("cal-next").onclick = ()=>{ ui.calMonth = new Date(year, month+1, 1); renderCalendar(); };
  document.getElementById("cal-today").onclick = ()=>{ ui.calMonth = new Date(); ui.calSelected = todayKey(); renderCalendar(); };
  root.querySelectorAll("[data-daykey]").forEach(el=> el.onclick = ()=>{ ui.calSelected = el.dataset.daykey; renderCalendar(); });
  renderCalDetail();
  mountIcons();
}
function dayHasActivity(key){
  if(!key) return false;
  if(state.tasks.some(t=>t.date===key && t.completed)) return true;
  if(state.habitLogs[key] && Object.values(state.habitLogs[key]).some(Boolean)) return true;
  if(state.water.logs[key]>0) return true;
  if(state.mood.logs[key]) return true;
  if(state.workouts.some(w=>w.date===key)) return true;
  return false;
}

function weekStats(days){
  const completion = Math.round(days.reduce((s,d)=>s+dayCompletionPct(d),0)/days.length);
  const waterAvg = Math.round(days.reduce((s,d)=>s+(state.water.logs[d]||0),0)/days.length);
  const focusTotal = days.reduce((s,d)=>s+(state.pomodoro.sessions[d]||0),0);
  const workoutDays = days.filter(d=>state.workouts.some(w=>w.date===d)).length;
  const moodVals = days.map(d=>(state.mood.logs[d]||{}).value).filter(Boolean);
  const moodAvg = moodVals.length ? Math.round(moodVals.reduce((a,b)=>a+b,0)/moodVals.length*10)/10 : null;
  const habitRate = state.habits.length ? Math.round(days.reduce((s,d)=>{
    const done = state.habits.filter(h=>(state.habitLogs[d]||{})[h.id]).length;
    return s + (done/state.habits.length*100);
  },0)/days.length) : 0;
  return {completion, waterAvg, focusTotal, workoutDays, moodAvg, habitRate};
}
function trendArrow(curr, prev){
  if(prev===null || curr===null) return "";
  const diff = curr-prev;
  if(Math.abs(diff)<1) return `<span class="muted" style="font-size:11px;">— steady</span>`;
  const up = diff>0;
  return `<span style="font-size:11px; font-weight:700; color:${up?'var(--accent)':'var(--danger)'};">${up?'↑':'↓'} ${Math.abs(Math.round(diff))}</span>`;
}
function weeklyReportCardHtml(){
  const thisWeek = lastNDays(7);

  const cur = weekStats(thisWeek);
  const prev = weekStats(lastWeek);

  let narrative = `You completed <strong>${cur.completion}%</strong> of your daily items this week`;
  narrative += prev.completion ? (cur.completion>=prev.completion ? `, up from ${prev.completion}% last week.` : `, down from ${prev.completion}% last week.`) : ".";
  if(habitBest && habitStreak(habitBest.id,todayKey())>0){
    narrative += ` Your strongest streak is <strong>${escapeHtml(habitBest.name)}</strong> at ${habitStreak(habitBest.id,todayKey())} days.`;
  }
  narrative += cur.workoutDays>0 ? ` You worked out ${cur.workoutDays} day${cur.workoutDays===1?'':'s'} this week.` : ` No workouts logged this week yet.`;
  return `
  <div class="card" style="margin-top:18px; background:linear-gradient(155deg,var(--accent-soft),var(--card));">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">

      <span class="muted" style="font-size:11.5px;">${fmtDateLong(lastNDays(7)[0])} – ${fmtDateLong(todayKey())}</span>
    </div>
    <p style="font-size:14px; line-height:1.6; margin:0 0 14px;">${narrative}</p>
    <div class="grid grid-3" style="gap:10px;">
      <div class="card-tight" style="background:var(--card); border-radius:14px;">
        <div class="muted" style="font-size:11px;">Completion</div>
        <div style="display:flex; align-items:baseline; gap:6px;"><span class="mono" style="font-weight:700; font-size:17px;">${cur.completion}%</span>${trendArrow(cur.completion,prev.completion)}</div>
      </div>
      <div class="card-tight" style="background:var(--card); border-radius:14px;">
        <div class="muted" style="font-size:11px;">Habit consistency</div>
        <div style="display:flex; align-items:baseline; gap:6px;"><span class="mono" style="font-weight:700; font-size:17px;">${cur.habitRate}%</span>${trendArrow(cur.habitRate,prev.habitRate)}</div>
      </div>
      <div class="card-tight" style="background:var(--card); border-radius:14px;">
        <div class="muted" style="font-size:11px;">Avg water</div>
        <div style="display:flex; align-items:baseline; gap:6px;"><span class="mono" style="font-weight:700; font-size:17px;">${cur.waterAvg}ml</span>${trendArrow(cur.waterAvg,prev.waterAvg)}</div>
      </div>
      <div class="card-tight" style="background:var(--card); border-radius:14px;">
        <div class="muted" style="font-size:11px;">Focus time</div>
        <div style="display:flex; align-items:baseline; gap:6px;"><span class="mono" style="font-weight:700; font-size:17px;">${Math.round(cur.focusTotal/60*10)/10}h</span>${trendArrow(cur.focusTotal,prev.focusTotal)}</div>
      </div>
      <div class="card-tight" style="background:var(--card); border-radius:14px;">
        <div class="muted" style="font-size:11px;">Workout days</div>
        <div style="display:flex; align-items:baseline; gap:6px;"><span class="mono" style="font-weight:700; font-size:17px;">${cur.workoutDays}/7</span>${trendArrow(cur.workoutDays,prev.workoutDays)}</div>
      </div>
      <div class="card-tight" style="background:var(--card); border-radius:14px;">
        <div class="muted" style="font-size:11px;">Avg mood</div>

      </div>

function barChart(labels, values, unit){
  const max = Math.max(1, ...values);
  return `<div class="chart-bars">
    ${values.map((v,i)=>`
      <div style="flex:1; text-align:center;">
        <div class="cb" style="height:90px;"><span style="height:${clamp(v/max*100,3,100)}%; position:absolute; bottom:0; left:0; right:0;"></span></div>
        <div class="cb-label-standalone">${labels[i].slice(8)}</div>
      </div>
    `).join("")}
  </div>
  <div class="muted" style="font-size:11px; text-align:right; margin-top:4px;">unit: ${unit}</div>`;
}
function moodLineChart(labels, values){
  const w=280, h=90, pad=14;
  const pts = values.map((v,i)=>{
    const x = pad + (i/(values.length-1))*(w-2*pad);
    const y = v? (h-pad) - ((v-1)/4)*(h-2*pad) : null;
    return {x,y,v};
  });
  const validPts = pts.filter(p=>p.y!==null);
  const path = validPts.map((p,i)=> (i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${validPts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="var(--accent)"/>`).join("")}
  </svg>
  <div style="display:flex; justify-content:space-between; margin-top:2px;">${labels.map(l=>`<span style="font-size:10px; color:var(--ink-soft);">${l.slice(8)}</span>`).join("")}</div>`;
}

          : `<button class="btn btn-ghost" id="jl-setpin" style="width:100%;">${icon("lock",14)} ${s.journalPinHash?"Change PIN":"Set PIN"}</button>`
        }
      </div>
      <p class="muted" style="font-size:11.5px; margin-top:10px;">This is a casual privacy screen for shared devices, not high-security encryption — your journal data itself is always stored locally on this device. Device unlock uses your phone's own Face ID/fingerprint/screen-lock check; Daybook never sees your biometric data.</p>
    </div>

    <div class="section-title"><h2>Notifications</h2></div>
    <div class="card">
      <div class="linkline"><span>Task reminders</span><label class="switch"><input type="checkbox" id="nt-tasks" ${s.notifTasks?'checked':''}/><span class="slider"></span></label></div>
      <div class="linkline"><span>Medicine reminders</span><label class="switch"><input type="checkbox" id="nt-meds" ${s.notifMeds?'checked':''}/><span class="slider"></span></label></div>
      <div class="linkline"><span>Water reminders</span><label class="switch"><input type="checkbox" id="nt-water" ${s.notifWater?'checked':''}/><span class="slider"></span></label></div>
      <div class="linkline"><span>Habit reminders</span><label class="switch"><input type="checkbox" id="nt-habits" ${s.notifHabits?'checked':''}/><span class="slider"></span></label></div>
      <div class="linkline"><span>Enable browser notifications</span><button class="btn btn-soft" id="nt-enable" style="padding:6px 12px; font-size:12.5px;">${("Notification" in window && Notification.permission==="granted")?"Enabled ✓":"Enable"}</button></div>
      <div class="linkline"><span>Notification sound</span><label class="switch"><input type="checkbox" id="nt-sound" ${s.notifSound?'checked':''}/><span class="slider"></span></label></div>
      <div class="field" style="margin-top:12px;">
        <label class="field-label">Sound</label>
        <select id="nt-soundchoice">
          <option value="chime" ${s.soundChoice==='chime'?'selected':''}>Chime</option>
          <option value="ping" ${s.soundChoice==='ping'?'selected':''}>Ping</option>
          <option value="bell" ${s.soundChoice==='bell'?'selected':''}>Bell</option>
        </select>
      </div>
      <div class="row" style="margin-top:10px;">
        <button class="btn btn-ghost" id="nt-testsound">${icon("volume-2",15)} Test Sound</button>
        <button class="btn btn-ghost" id="nt-testnotif">${icon("bell-ring",15)} Test Notification</button>
      </div>
      <p class="muted" style="font-size:11.5px; margin-top:10px;">Browser notifications require permission and may not be available on every device — the app will use in-app toasts instead when unavailable.</p>
    </div>

    <div class="section-title"><h2>Quotes</h2></div>
    <div class="card">
      <div class="field"><label class="field-label">Preference</label>
        <select id="st-quotepref">
          <option value="mixed" ${s.quotePref==='mixed'?'selected':''}>Mixed</option>
          <option value="favorites" ${s.quotePref==='favorites'?'selected':''}>Favorites first</option>
        </select>
      </div>
      <div class="muted" style="font-size:12.5px;">${state.favoriteQuotes.length} favorited quote(s)</div>
    </div>

    <div class="section-title"><h2>Data</h2></div>
    <div class="card">
      <div class="row" style="margin-bottom:10px;">
        <button class="btn btn-ghost" id="data-export">${icon("download",15)} Export JSON</button>
        <button class="btn btn-ghost" id="data-import-btn">${icon("upload",15)} Import JSON</button>
        <input type="file" id="data-import-file" accept="application/json" style="display:none;"/>
      </div>
      <button class="btn btn-danger" id="data-reset" style="width:100%;">${icon("refresh-ccw",15)} Reset All Data</button>
    </div>
  `;
  document.getElementById("st-name").onchange = e=>{ u.name=e.target.value.trim()||"Friend"; save(); renderShell(); };
  document.getElementById("st-open-dash").onclick = openDashboardCustomizeModal;
  root.querySelectorAll("[data-avatar]").forEach(b=> b.onclick = ()=>{ u.avatarEmoji=b.dataset.avatar; save(); renderSettings(); renderShell(); });
  document.getElementById("st-dark").onchange = e=>{ u.darkMode=e.target.checked; applyTheme(); save(); renderShell(); };
  root.querySelectorAll("[data-accent]").forEach(b=> b.onclick = ()=>{ u.accent=b.dataset.accent; applyAccent(); save(); renderSettings(); });
  document.getElementById("st-save-goals").onclick = ()=>{
    s.waterGoalMl = parseInt(document.getElementById("st-water").value,10)||2500;
    s.sleepGoalHrs = parseFloat(document.getElementById("st-sleep").value)||8;
    s.pomodoroFocusMin = parseInt(document.getElementById("st-focus").value,10)||25;
    s.pomodoroBreakMin = parseInt(document.getElementById("st-break").value,10)||5;
    ui.pomodoro.remaining = s.pomodoroFocusMin*60; ui.pomodoro.mode="focus";
    save(); toast("Goals saved","check");
  };
  document.getElementById("st-addcat").onclick = ()=>{
    const v = document.getElementById("st-newcat").value.trim();
    if(v && !state.categories.includes(v)){ state.categories.push(v); save(); renderSettings(); }
  };
  root.querySelectorAll("[data-del-cat]").forEach(b=> b.onclick = ()=>{
    state.categories = state.categories.filter(c=>c!==b.dataset.delCat); save(); renderSettings();
  });
  document.getElementById("jl-enabled").onchange = e=>{
    const method = s.journalUnlockMethod || "pin";
    const hasCred = method==="device" ? s.journalWebAuthnCredId : s.journalPinHash;
    if(e.target.checked && !hasCred){
      e.target.checked = false;
      toast(method==="device" ? "Set up device unlock first" : "Set a PIN first");
      if(method==="device") setupDeviceUnlock().then(ok=>{ if(ok){ toast("Device unlock set up","fingerprint"); renderSettings(); } });
      else openJournalPinModal(true);
      return;
    }
    s.journalLockEnabled = e.target.checked;
    if(!s.journalLockEnabled) ui.journalUnlocked = true;
    save();
  };
  root.querySelectorAll("[data-unlock-method]").forEach(b=> b.onclick = ()=>{
    if(b.disabled) return;
    s.journalUnlockMethod = b.dataset.unlockMethod;
    save(); renderSettings();
  });
  const setPinBtn = document.getElementById("jl-setpin");
  if(setPinBtn) setPinBtn.onclick = ()=> openJournalPinModal(false);
  const setDeviceBtn = document.getElementById("jl-setdevice");
  if(setDeviceBtn) setDeviceBtn.onclick = async ()=>{
    const ok = await setupDeviceUnlock();
    if(ok){ toast("Device unlock set up","fingerprint"); renderSettings(); }
    else toast("Setup was cancelled or failed");
  };
  ["tasks","meds","water","habits","sound"].forEach(k=>{
    document.getElementById("nt-"+k).onchange = e=>{ s["notif"+k.charAt(0).toUpperCase()+k.slice(1)] = e.target.checked; save(); if(e.target.checked) ensureNotifPermission(); };
  });
  document.getElementById("nt-soundchoice").onchange = e=>{ s.soundChoice=e.target.value; save(); };
  document.getElementById("nt-testsound").onclick = ()=>playSound();
  document.getElementById("nt-testnotif").onclick = ()=> requestNotifPermissionThenTest();
  document.getElementById("nt-enable").onclick = ()=>{ requestNotifPermissionThenTest(); setTimeout(renderSettings, 400); };
  document.getElementById("st-quotepref").onchange = e=>{ s.quotePref=e.target.value; save(); };
  document.getElementById("data-export").onclick = exportData;
  document.getElementById("data-import-btn").onclick = ()=> document.getElementById("data-import-file").click();
  document.getElementById("data-import-file").onchange = importData;
  document.getElementById("data-reset").onclick = ()=>{
    confirmAction("Reset all data?","This permanently deletes everything and restores sample data.", ()=>{
      state = defaultState(); save(); applyTheme(); render(); renderShell(); toast("Data reset","refresh-ccw");
    });
  };
  mountIcons();
}

/* ---------------- data export/import ---------------- */
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "daybook-export-"+todayKey()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast("Data exported","download");
}
function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      state = Object.assign(defaultState(), parsed);
      save(); applyTheme(); render(); renderShell();
      toast("Data imported","upload");
    }catch(err){ toast("Import failed — invalid file"); }
  };
  reader.readAsText(file);
  e.target.value="";
}

/* =========================================================
   NOTIFICATIONS / SOUND
   ========================================================= */
let audioCtx=null;
function playSound(){
  if(!state.settings.notifSound) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const freqMap = {chime:[880,1108], ping:[1200], bell:[660,990,1320]};
    const freqs = freqMap[state.settings.soundChoice] || freqMap.chime;
    freqs.forEach((f,i)=>{
      const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
      o.type="sine"; o.frequency.value=f;
      o.connect(g); g.connect(audioCtx.destination);
      const t0 = audioCtx.currentTime + i*0.12;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.18, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+0.35);
      o.start(t0); o.stop(t0+0.4);
    });
  }catch(e){}
}
function requestNotifPermissionThenTest(){
  if(!("Notification" in window)){ toast("Notifications aren't supported here — using in-app alerts instead."); playSound(); return; }
  if(Notification.permission==="granted"){ notify("Test notification","This is what your reminders will look like."); return; }
  if(Notification.permission==="denied"){ toast("Notifications are blocked in browser settings."); return; }
  Notification.requestPermission().then(p=>{
    if(p==="granted") notify("Notifications enabled","You'll get reminders here.");
    else toast("Permission not granted — using in-app alerts instead.");
  });
}
function notify(title, body){
  playSound();
  if("Notification" in window && Notification.permission==="granted"){
    try{ new Notification(title, {body, icon:"icon.svg"}); return; }catch(e){}
  }
  toast(title+(body?" — "+body:""), "bell");
}
function ensureNotifPermission(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="default"){
    Notification.requestPermission().then(p=>{
      if(p==="granted") toast("Reminders enabled","bell");
    });
  }
}

/* =========================================================
   ROUTER / RENDER
   ========================================================= */
function render(){
  applyTheme();
  renderShell();
  switch(ui.route){
    case "home": renderHome(); break;
    case "tasks": renderTasks(); break;
    case "habits": renderHabits(); break;
    case "goals": renderGoals(); break;
    case "focus": renderFocus(); break;
    case "journal": renderJournal(); break;
    case "health": renderHealth(); break;
    case "calendar": renderCalendar(); break;
    case "insights": renderInsights(); break;
    case "settings": renderSettings(); break;
    default: renderHome();
  }
}

/* ---------------- init ---------------- */
/* ---------------- first-run onboarding ---------------- */
const ONBOARD_HABIT_SUGGESTIONS = [
  {name:"Workout", icon:"dumbbell"}, {name:"Read", icon:"book-open"}, {name:"Meditate", icon:"brain"},
  {name:"Study", icon:"graduation-cap"}, {name:"Sleep on time", icon:"moon"}, {name:"No junk food", icon:"apple"},
];
function openOnboardingModal(){
  openModal(`
    <div class="modal-head"><h3>Welcome to Daybook 👋</h3></div>
    <p class="muted" style="font-size:13px; margin-top:-8px; margin-bottom:16px;">Let's set a few things up. Everything here can be changed anytime later.</p>

    <div class="field"><label class="field-label">Your name</label><input type="text" id="ob-name" placeholder="e.g. Alex" value="${escapeHtml(state.user.name||'')}"/></div>
    <div class="field"><label class="field-label">Pick an avatar</label>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        ${["🌿","🌸","☀️","🌙","🔥","🐣","🌊","⭐","🍃","🦋"].map(e=>`<button class="btn-icon" data-ob-avatar="${e}" style="font-size:17px; ${state.user.avatarEmoji===e?'background:var(--accent-soft);border-color:var(--accent);':''}">${e}</button>`).join("")}
      </div>
    </div>
    <div class="field"><label class="field-label">Daily water goal (ml)</label><input type="number" id="ob-water" value="${state.settings.waterGoalMl}" step="250"/></div>
    <div class="field"><label class="field-label">Habits you want to track</label>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        ${ONBOARD_HABIT_SUGGESTIONS.map(h=>`<button class="btn-icon" data-ob-habit="${escapeHtml(h.name)}" data-ob-icon="${h.icon}" style="width:auto;padding:0 12px;gap:6px;display:inline-flex;align-items:center;">${icon(h.icon,15)} ${h.name}</button>`).join("")}
      </div>
    </div>
    <div class="field"><label class="field-label">A main goal (optional)</label><input type="text" id="ob-goal" placeholder="e.g. Prepare for finals, Ship the redesign"/></div>
    <div class="field"><label class="field-label">First task for today (optional)</label><input type="text" id="ob-task" placeholder="e.g. Plan the week"/></div>
    <div class="field"><label class="field-label">A medicine/supplement to track (optional)</label><input type="text" id="ob-med" placeholder="e.g. Vitamin D"/></div>

    <div class="row" style="margin-top:8px;">
      <button class="btn btn-ghost" id="ob-skip">Skip for now</button>
      <button class="btn btn-primary" id="ob-done" style="flex:2;">${icon("check",15)} Get Started</button>
    </div>
  `);
  let selectedAvatar = state.user.avatarEmoji || "🌿";
  let selectedHabits = [];
  document.querySelectorAll("[data-ob-avatar]").forEach(b=> b.onclick = ()=>{
    selectedAvatar = b.dataset.obAvatar;
    document.querySelectorAll("[data-ob-avatar]").forEach(x=>x.style.cssText="font-size:17px;");
    b.style.cssText = "font-size:17px;background:var(--accent-soft);border-color:var(--accent);";
  });
  document.querySelectorAll("[data-ob-habit]").forEach(b=> b.onclick = ()=>{
    const name = b.dataset.obHabit;
    const idx = selectedHabits.indexOf(name);
    if(idx>=0){ selectedHabits.splice(idx,1); b.style.cssText="width:auto;padding:0 12px;gap:6px;display:inline-flex;align-items:center;"; }
    else{ selectedHabits.push(name); b.style.cssText="width:auto;padding:0 12px;gap:6px;display:inline-flex;align-items:center;background:var(--accent-soft);color:var(--accent);border-color:var(--accent);"; }
  });
  const finish = ()=>{ state.onboarded = true; save(); closeModal(); rerenderCurrent(); renderShell(); };
  document.getElementById("ob-skip").onclick = finish;
  document.getElementById("ob-done").onclick = ()=>{
    const name = document.getElementById("ob-name").value.trim();
    if(name) state.user.name = name;
    state.user.avatarEmoji = selectedAvatar;
    state.settings.waterGoalMl = parseInt(document.getElementById("ob-water").value,10) || state.settings.waterGoalMl;
    selectedHabits.forEach(name=>{
      const meta = ONBOARD_HABIT_SUGGESTIONS.find(h=>h.name===name);
      if(!state.habits.some(h=>h.name===name)) state.habits.push({id:uid(), name, icon:meta?meta.icon:"circle", createdAt:todayKey()});
    });
    const goalTitle = document.getElementById("ob-goal").value.trim();
    if(goalTitle) state.goals.push({id:uid(), title:goalTitle, type:"personal", deadline:"", status:"active", progress:0, topics:[], createdAt:todayKey()});
    const taskTitle = document.getElementById("ob-task").value.trim();
    if(taskTitle) state.tasks.push({id:uid(), title:taskTitle, description:"", date:todayKey(), time:"", priority:"med", category:"", completed:false});
    const medName = document.getElementById("ob-med").value.trim();
    if(medName) state.medicines.push({id:uid(), name:medName, dosage:"", time:""});
    finish();
    toast("You're all set!","sparkles");
  };
}
function init(){
  applyTheme();
  render();
  if(!state.onboarded){ setTimeout(openOnboardingModal, 350); }
  // Sync pomodoro remaining with settings on first load
  ui.pomodoro.remaining = state.settings.pomodoroFocusMin*60;
  // register service worker gracefully
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(()=>{ /* ignore if unavailable in this environment */ });
  }
  startReminderEngine();
  checkDeviceUnlockSupport();
  migrateBase64MediaToIndexedDB();
}
/* ---------------- reminder engine (fixed) ----------------
   Runs every 15s (not gated to an exact second) and dedupes with
   a fired-set so a throttled/background tab still catches reminders
   without spamming repeats. */
const firedReminders = new Set();
function startReminderEngine(){
  checkReminders();
  setInterval(checkReminders, 15000);
}
function checkReminders(){
  const now = new Date();
  const hhmm = String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  const today = todayKey();
  if(state.settings.notifTasks){
    state.tasks.filter(t=>t.reminder && !t.completed && t.date===today && t.time).forEach(t=>{
      const key = "task-"+t.id+"-"+today;
      if(!firedReminders.has(key) && hhmm>=t.time){
        firedReminders.add(key);
        notify("Task reminder", t.title);
      }
    });
  }
  if(state.settings.notifMeds){
    const medLog = state.medicineLogs[today]||{};
    state.medicines.filter(m=>m.time && !medLog[m.id]).forEach(m=>{
      const key = "med-"+m.id+"-"+today;
      if(!firedReminders.has(key) && hhmm>=m.time){
        firedReminders.add(key);
        notify("Medicine reminder", m.name+(m.dosage?" — "+m.dosage:""));
      }
    });
  }
  if(state.settings.notifFocusSessions !== false){
    state.focusSessions.filter(s=>!s.completed && s.date===today && s.startTime).forEach(s=>{
      const key = "session-"+s.id+"-"+today;
      if(!firedReminders.has(key) && hhmm>=s.startTime){
        firedReminders.add(key);
        notify("Session reminder", (s.label||sessionTypeMeta(s.type).label)+" is scheduled now");
      }
    });
  }
}
document.addEventListener("DOMContentLoaded", init);
})();
</script>
